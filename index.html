<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com" crossorigin="anonymous">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin="anonymous">
<title>Budget</title>
<style>
/* =====================================================================
   Budget · v7 — interface inspirée d'iOS 26/27
   Couleurs système d'Apple, police SF Pro (SF Pro Rounded pour les montants),
   listes groupées, verre (Liquid Glass) pour la barre d'onglets et les boutons.
   ===================================================================== */
:root{
  --bg:#f2f2f7; --card:#fff; --sheet-bg:#f2f2f7; --sheet-card:#fff;
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2); --fill3:rgba(118,118,128,.08);
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.2);
  --tint:#007aff; --green:#34c759; --green-t:#248a3d; --red:#ff3b30; --red-t:#d70015;
  --orange:#ff9500; --orange-t:#c93400; --indigo:#5856d6; --gray:#8e8e93;
  --glass:rgba(255,255,255,.7); --glass-line:rgba(0,0,0,.07); --glass-hi:rgba(255,255,255,.9);
  --glass-shadow:0 10px 30px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue","Inter",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Inter",sans-serif;
  --safe-t:max(env(safe-area-inset-top),16px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --gut:20px;
  --tab-h:62px;
  --tab-y:max(calc(env(safe-area-inset-bottom,0px) - 12px),14px);
  --nav-h:52px;
  --r-grp:22px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1c1c1e; --sheet-bg:#1c1c1e; --sheet-card:#2c2c2e;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36); --fill3:rgba(118,118,128,.16);
    --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
    --tint:#0a84ff; --green:#30d158; --green-t:#30d158; --red:#ff453a; --red-t:#ff453a;
    --orange:#ff9f0a; --orange-t:#ff9f0a; --indigo:#5e5ce6;
    --glass:rgba(38,38,40,.62); --glass-line:rgba(255,255,255,.1); --glass-hi:rgba(255,255,255,.1);
    --glass-shadow:0 10px 30px rgba(0,0,0,.5);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100vh}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;touch-action:manipulation;margin:0}
button{cursor:pointer;-webkit-user-select:none;user-select:none;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 55%,transparent);outline-offset:2px}
input::placeholder{color:var(--label3)}
.num{font-variant-numeric:tabular-nums}
.rnd{font-family:var(--round)}
.neg{color:var(--red-t)!important}
[hidden]{display:none!important}
svg{display:block}

/* ---------- verre (boutons, barre d'onglets) ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  box-shadow:var(--glass-shadow),inset 0 0 0 .5px var(--glass-line),inset 0 1px 0 var(--glass-hi)}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--label);flex:none;transition:transform .15s}
.gbtn:active{transform:scale(.92)}
.gbtn svg{width:20px;height:20px}

/* ---------- barre de navigation (titre réduit au défilement) ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(var(--safe-t) + var(--nav-h));
  padding:var(--safe-t) calc(var(--gut) + var(--safe-r)) 0 calc(var(--gut) + var(--safe-l));
  display:flex;align-items:center;justify-content:center;pointer-events:none}
.nav::before{content:'';position:absolute;inset:0 0 -12px 0;z-index:-1;opacity:0;transition:opacity .25s;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  -webkit-mask-image:linear-gradient(#000 calc(100% - 16px),transparent);mask-image:linear-gradient(#000 calc(100% - 16px),transparent)}
body.scrolled .nav::before{opacity:1}
.nav-t{text-align:center;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;min-width:0;max-width:60%}
body.scrolled .nav-t{opacity:1;transform:none}
.nav-t b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-t small{display:block;font-size:12px;color:var(--label2);margin-top:1px}
.nav-t small:empty{display:none}
.nav .back{position:absolute;left:calc(var(--gut) + var(--safe-l) - 4px);bottom:4px;pointer-events:auto;color:var(--label)}
.nav .back svg{width:13px;height:21px;margin-left:-2px}

/* ---------- mise en page ---------- */
main{max-width:560px;margin:0 auto;
  padding:calc(var(--safe-t) + 6px) calc(var(--gut) + var(--safe-r)) calc(var(--tab-h) + var(--tab-y) + 40px) calc(var(--gut) + var(--safe-l))}
body.sub main{padding-top:calc(var(--safe-t) + var(--nav-h))}
.lt{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 18px}
.lt-t{min-width:0}
.lt h1{font-size:34px;line-height:41px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd{font-size:15px;color:var(--label2);min-height:20px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.upd.ok{color:var(--green-t)}
body.sub .upd{display:none}.upd.warn{color:var(--orange-t)}
.month{display:flex;align-items:center;height:40px;border-radius:999px;margin-top:1px;flex:none}
.month button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tint)}
.month button:active{background:var(--fill)}
.month button svg{width:9px;height:15px}
.month span{min-width:104px;text-align:center;font-size:15px;font-weight:600;padding:0 2px;white-space:nowrap}
body.no-month .month{display:none}

.view{display:none}
.view.on{display:block}

/* en-têtes et pieds de groupes */
.hh{font-size:22px;line-height:28px;font-weight:700;margin:34px 4px 12px}
.gh{font-size:13px;color:var(--label2);margin:26px 16px 8px}
.gf{font-size:13px;line-height:1.38;color:var(--label2);margin:8px 16px 0}
.c{text-align:center}

/* ---------- listes groupées ---------- */
.grp{background:var(--card);border-radius:var(--r-grp);overflow:hidden}
.grp + .grp{margin-top:20px}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;text-align:left;font-size:17px}
.sepd::before,.grp > .row + .row::before,.grp > .row + .frow::before,.grp > .frow + .row::before,.grp > .frow + .frow::before{
  content:'';position:absolute;top:0;right:0;left:var(--sl,16px);border-top:.5px solid var(--sep)}
button.row:active,.frow:active{background:var(--fill3)}
.grp.manual > .row + .row::before{display:none}
.grp.manual > .row.sepd::before{display:block}
.row .k{flex:none;color:var(--label)}
.row .v{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v .t{overflow:hidden;text-overflow:ellipsis}
.row .v.set{color:var(--label)}
.chev{width:8px;height:14px;color:var(--label3);flex:none}
.row input{flex:1;min-width:0;border:0;outline:0;background:transparent;text-align:right;font-size:17px;padding:4px 0;-webkit-appearance:none;appearance:none}
.row.ic{--sl:60px}
.row.link .k{color:var(--tint)}
.row.danger{justify-content:center}.row.danger .k{color:var(--red-t)}
.row.center{justify-content:center}

/* icônes de couleur (style Réglages) */
.tile{--c:var(--gray);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 84%,#fff),var(--c))}
.tile svg{width:19px;height:19px}
.tile.l{width:40px;height:40px;border-radius:11px}
.tile.l svg{width:23px;height:23px}

/* contrôle segmenté */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px;gap:0}
.seg button{min-height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--label);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){.seg button[aria-pressed="true"]{background:#636366}}

/* bouton principal */
.cta{position:relative;display:block;width:100%;height:54px;border-radius:999px;background:var(--tint);color:#fff;font-size:17px;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s,opacity .2s}
.cta:active{transform:scale(.98)}
.cta[disabled]{opacity:.38}
.cta .spin{display:none;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;
  animation:spin .8s linear infinite;position:absolute;left:50%;top:50%;margin:-10px 0 0 -10px}
.cta.busy .txt{visibility:hidden}.cta.busy .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.tbtn{color:var(--tint);font-size:17px;min-height:44px;padding:0 8px}

/* ---------- Accueil ---------- */
.hero{text-align:center;padding:14px 0 22px}
.hero-l{font-size:15px;font-weight:600;color:var(--label2)}
.hero-v{font-size:52px;line-height:1.08;font-weight:700;margin-top:6px;letter-spacing:-.01em;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{position:relative;text-align:center;padding:14px 6px 15px}
.stat + .stat::before{content:'';position:absolute;left:0;top:14px;bottom:14px;border-left:.5px solid var(--sep)}
.stat .l{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.stat .l svg{width:13px;height:13px}
.stat .v{font-size:19px;font-weight:600;margin-top:5px;white-space:nowrap}
.stat.inc .l{color:var(--green-t)}.stat.exp .l{color:var(--red-t)}.stat.sav .l{color:var(--indigo)}

.ring-card{padding:24px 16px 0;text-align:center}
.ring{position:relative;width:212px;height:212px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke-width:20;stroke:var(--fill)}
.ring .prg{fill:none;stroke-width:20;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.22,.9,.25,1)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-size:34px;line-height:1.1;font-weight:700}
.ring-c small{font-size:15px;color:var(--label2);margin-top:3px}
.ring-foot{display:grid;grid-template-columns:1fr 1fr;margin:20px -16px 0;border-top:.5px solid var(--sep)}
.ring-foot > div{position:relative;padding:13px 6px 15px}
.ring-foot > div + div::before{content:'';position:absolute;left:0;top:13px;bottom:13px;border-left:.5px solid var(--sep)}
.ring-foot small{display:block;font-size:13px;color:var(--label2)}
.ring-foot b{display:block;font-size:19px;font-weight:600;margin-top:3px}
.ring-foot .over b{color:var(--red-t)}
.ring-empty{padding:28px 20px;text-align:center}
.ring-empty b{display:block;font-size:17px;font-weight:600}
.ring-empty p{margin:6px 0 4px;color:var(--label2);font-size:15px}

.cats{margin-top:12px}
.crow{--sl:58px;position:relative;display:flex;align-items:flex-start;gap:12px;padding:13px 16px 12px}
.crow + .crow::before,.cats > .more::before{content:'';position:absolute;top:0;right:0;left:58px;border-top:.5px solid var(--sep)}
.cats > .more::before{left:16px}
.crow .tile{margin-top:1px}
.cm{flex:1;min-width:0}
.c1,.c3{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.c1 .n{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c1 .a{font-size:17px;white-space:nowrap}
.c3{font-size:13px;color:var(--label2);margin-top:7px}
.c3 .over{color:var(--red-t)}.c3 .warn{color:var(--orange-t)}
.bar{height:5px;background:var(--fill);border-radius:3px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--tint);transition:width .6s cubic-bezier(.22,.9,.25,1)}
.bar i.warn{background:var(--orange)}.bar i.over{background:var(--red)}.bar i.none{background:var(--label3)}
.more{position:relative;width:100%;min-height:50px;color:var(--tint);font-size:17px}
.acct .an{flex:1;min-width:0}
.acct .an b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .an small{display:block;font-size:13px;color:var(--label2);margin-top:1px}
.acct .av{font-size:17px;white-space:nowrap}

/* ---------- Ajouter ---------- */
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:30px 0 30px;cursor:text}
.amount input{width:1.2ch;max-width:78%;border:0;outline:0;background:transparent;padding:0;text-align:center;
  font-family:var(--round);font-size:64px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;caret-color:var(--tint)}
.amount .cur{font-family:var(--round);font-size:38px;font-weight:600;color:var(--label2)}
.blk{margin-top:26px}
.blk > .gh{margin-top:0}
.qcats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.qc{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;padding:2px 0}
.qc .tile{width:58px;height:58px;border-radius:50%;transition:transform .15s,box-shadow .2s}
.qc .tile svg{width:26px;height:26px}
.qc:active .tile{transform:scale(.93)}
.qc .qn{font-size:12px;line-height:1.25;text-align:center;color:var(--label2);max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;-webkit-hyphens:auto;hyphens:auto}
.qc[aria-pressed="true"] .tile{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--tint)}
.qc[aria-pressed="true"] .qn{color:var(--label);font-weight:600}
.qc.more .tile{--c:var(--fill2);background:var(--fill);color:var(--label)}
.qhint{display:flex;align-items:center;gap:5px;min-height:18px;font-size:13px;color:var(--tint);margin:8px 16px 0}
.qhint:empty{display:none}
.qhint svg{width:14px;height:14px;flex:none}
.date-row{cursor:pointer}
.date-row .pillv{margin-left:auto;background:var(--fill);border-radius:8px;padding:6px 11px;font-size:17px;color:var(--label);white-space:nowrap}
.date-row input[type="date"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:17px;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:1}
.add-cta{margin-top:30px}

/* ---------- Historique ---------- */
.searchbar{display:flex;gap:10px;align-items:center}
.sfield{flex:1;position:relative}
.sfield > svg{position:absolute;left:13px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--label2);pointer-events:none}
.sfield input{width:100%;height:44px;border:0;border-radius:999px;background:var(--fill);padding:0 42px 0 39px;font-size:17px;outline:0;-webkit-appearance:none;appearance:none}
.sfield input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sfield .clr{position:absolute;right:4px;top:50%;margin-top:-18px;width:36px;height:36px;display:none;place-items:center;color:var(--label3)}
.sfield .clr svg{width:18px;height:18px}
.sfield.has .clr{display:grid}
.fbtn{position:relative;color:var(--tint)}
.fbtn .n{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--tint);color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px}
.fbtn.on .n{display:grid}
.factive{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.factive:empty{display:none}
.ftag{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 8px 0 12px;border-radius:999px;background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint);font-size:15px;font-weight:600}
.ftag svg{width:14px;height:14px}
.hsum{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--label2);margin:16px 16px 0}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 16px 8px;font-size:15px;font-weight:600;color:var(--label2)}
#hist > .dayh:first-child{margin-top:20px}
.dayh .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--label)}
.dayh .t{font-weight:500}
.dayh .t.inc{color:var(--green-t)}
.list{overflow:hidden}
.sw{position:relative;overflow:hidden}
.sw .bin{position:absolute;inset:0;background:var(--red);display:flex;align-items:center;color:#fff;width:100%;visibility:hidden}
.sw.drag .bin,.sw.open .bin,.sw.gone .bin{visibility:visible}
.sw .bin span{width:76px;display:grid;place-items:center}
.sw .bin svg{width:23px;height:23px}
.item{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:11px 16px;background:var(--card);
  touch-action:pan-y;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .15s;will-change:transform;cursor:pointer}
.item:active{background:color-mix(in srgb,var(--card) 92%,var(--label))}
.sw + .sw .item::before{content:'';position:absolute;top:0;right:0;left:68px;border-top:.5px solid var(--sep)}
.sw.drag .item{transition:none}
.sw.gone{transition:height .25s ease,opacity .25s;opacity:0}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m small{display:flex;align-items:center;gap:5px;font-size:15px;color:var(--label2);margin-top:1px;white-space:nowrap;overflow:hidden}
.item .m small span{overflow:hidden;text-overflow:ellipsis}
.item .m small .pend{color:var(--orange-t);flex:none}
.item .amt{font-size:17px;white-space:nowrap}
.amt.INC{color:var(--green-t)}.amt.TRF{color:var(--label2)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange-t);margin-left:6px;vertical-align:2px}
.swipe-hint{font-size:13px;color:var(--label3);text-align:center;margin:18px 0 0}
.empty{padding:44px 24px;text-align:center}
.empty .eg{width:56px;height:56px;margin:0 auto 12px;color:var(--label3)}
.empty .eg svg{width:100%;height:100%}
.empty b{display:block;font-size:20px;font-weight:600}
.empty p{margin:6px 0 0;font-size:15px;color:var(--label2);line-height:1.38}
.empty .tbtn{margin-top:10px}

/* ---------- Réglages ---------- */
.appcard{display:flex;align-items:center;gap:14px;padding:14px 16px}
.appcard img{width:60px;height:60px;border-radius:14px;flex:none;box-shadow:0 0 0 .5px var(--glass-line)}
.appcard b{display:block;font-size:20px;font-weight:600}
.appcard small{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--label2);margin-top:2px}
.appcard small i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.appcard small i.off{background:var(--orange)}

.bud-in{display:flex;align-items:baseline;gap:4px;background:var(--fill);border-radius:10px;padding:0 10px;height:40px;width:108px;flex:none;cursor:text}

.bud-in span{color:var(--label2)}

.sticky-save{position:sticky;bottom:calc(var(--tab-h) + var(--tab-y) + 16px);z-index:5;margin-top:24px;box-shadow:0 10px 26px color-mix(in srgb,var(--tint) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.sticky-save[disabled]{opacity:1;background:color-mix(in srgb,var(--tint) 40%,var(--bg));box-shadow:none}

.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--fill);color:var(--label2);white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}

/* ---------- barre d'onglets flottante ---------- */
.tabs{position:fixed;left:0;right:0;bottom:var(--tab-y);z-index:30;display:flex;gap:12px;justify-content:center;
  padding:0 calc(var(--gut) + var(--safe-r)) 0 calc(var(--gut) + var(--safe-l));pointer-events:none}
.tabbar{flex:1;max-width:360px;height:var(--tab-h);border-radius:999px;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;pointer-events:auto}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:999px;font-size:10px;font-weight:600;color:var(--label);transition:background .25s,color .25s}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-selected="true"]{color:var(--tint);background:var(--fill)}
.fab{width:var(--tab-h);height:var(--tab-h);border-radius:50%;display:grid;place-items:center;color:var(--tint);pointer-events:auto;flex:none;transition:transform .15s,background .25s,color .25s}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.94)}
.fab[aria-selected="true"]{background:var(--tint);color:#fff;box-shadow:0 10px 26px color-mix(in srgb,var(--tint) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.edge-b{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(var(--tab-h) + var(--tab-y) + 34px);pointer-events:none;
  background:linear-gradient(to top,color-mix(in srgb,var(--bg) 92%,transparent) 0%,color-mix(in srgb,var(--bg) 60%,transparent) 55%,transparent 100%)}

/* ---------- notification (en haut, style Dynamic Island) ---------- */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 4px);z-index:70;transform:translate(-50%,-14px) scale(.7);opacity:0;
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 40px);min-height:48px;padding:8px 18px 8px 10px;border-radius:999px;
  background:#000;color:#fff;box-shadow:0 12px 34px rgba(0,0,0,.28);font-size:15px;font-weight:600;
  transition:transform .45s cubic-bezier(.2,1.25,.3,1),opacity .2s;pointer-events:none}
@media (prefers-color-scheme: dark){.toast{background:#1c1c1e;box-shadow:0 12px 34px rgba(0,0,0,.6),inset 0 0 0 .5px rgba(255,255,255,.12)}}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.toast .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;background:#30d158}
.toast .ti svg{width:15px;height:15px}

.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .act{margin-left:4px;color:#0a84ff;font-weight:700;font-size:15px;min-height:32px;padding:0 2px;flex:none}

/* ---------- feuilles (édition, filtres, choix) ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.on{opacity:1;pointer-events:auto}

.sheet{--bg:var(--sheet-bg);--card:var(--sheet-card);

.sheet.on{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.22,1),visibility 0s;box-shadow:0 -2px 40px rgba(0,0,0,.12)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 6px}

.picker{z-index:56}
.pback{z-index:55}
.psearch{margin:0 0 14px}
.popt{--sl:58px;position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 16px;text-align:left;font-size:17px}
.popt + .popt::before{content:'';position:absolute;top:0;right:0;left:var(--sl);border-top:.5px solid var(--sep)}

.popt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- squelettes, erreurs ---------- */
.sk{background:linear-gradient(90deg,var(--fill3) 25%,var(--fill) 50%,var(--fill3) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--r-grp)}

.retry{height:44px;padding:0 22px;border-radius:999px;background:var(--tint);color:#fff;font-weight:600;font-size:15px}

/* ---------- connexion (premier lancement) ---------- */
body.setup .tabs,body.setup .lt,body.setup .nav,body.setup .edge-b{display:none}
.onb{text-align:center;padding:9vh 0 0;max-width:420px;margin:0 auto}

.setup-err{color:var(--red-t);font-size:15px;min-height:20px;margin:14px 8px 0;line-height:1.38}

body.is-offline .appcard small i{background:var(--orange)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

var VERSION='7';

   ===================================================================== */

function loadConf(){ try{ var c=JSON.parse(localStorage.getItem('budget:conf')||'null'); if(c && c.url && c.k) return c; }catch(e){} return null; }
function saveConf(c){ try{ if(c) localStorage.setItem('budget:conf',JSON.stringify(c)); else localStorage.removeItem('budget:conf'); }catch(e){} }
var TYPES = { EXP:{label:'Ajouter la dépense', name:'Dépense'}, INC:{label:'Ajouter le revenu', name:'Revenu'}, TRF:{label:'Enregistrer le virement', name:'Virement'} };
var OPEN_W = 76;          // largeur de la poubelle révélée par le glissement

var S = {
  view:'home', ym:currentYm(), sync:null, syncedAt:0, data:null, seq:0, loading:false, loadError:null,
  f:{ type:'EXP', cat:'', catAuto:false, catRule:'', acct:'', src:'', from:'', to:'' },
  busy:false, reqId:null, showAllCats:false,
  h:{ q:'', period:'month', type:'all', account:'', category:'' },
  base:null, ops:[], sending:false, retry:0, openRow:null, setPage:'main', budgetDraft:null, edit:null,
  status:'', hadOps:false, ringYm:null, scrolled:false
};

/* =====================================================================
   Utilitaires
   ===================================================================== */
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
var fmt, fmt0; try { fmt = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}); fmt0 = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0,minimumFractionDigits:0}); } catch(e){ fmt=null; fmt0=null; }
function eur(n){ n=Number(n)||0; return fmt ? fmt.format(n) : n.toFixed(2).replace('.',',')+' €'; }
function eur0(n){ n=Math.round(Number(n)||0); return fmt0 ? fmt0.format(n) : n+' €'; }
function eurR(n){ n=Number(n)||0; return Math.abs(n-Math.round(n))<0.005 ? eur(n).replace(/[,.]00(?=\s?€)/,'') : eur(n); }
function amtInput(n){ return (Math.round(n*100)/100).toFixed(2).replace('.',',').replace(/,00$/,''); }
function pct(n){ return Math.round(n*100)+' %'; }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem('budget:'+k); localStorage.setItem('budget:'+k,v); }catch(e){} return null; }
function currentYm(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function todayIso(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function shiftYm(ym,d){ var y=+ym.slice(0,4), m=+ym.slice(5,7)-1+d; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+('0'+(m+1)).slice(-2); }
function shiftDay(iso,d){ var p=iso.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+d)).toISOString().slice(0,10); }
function daysIn(ym){ return new Date(Date.UTC(+ym.slice(0,4),+ym.slice(5,7),0)).getUTCDate(); }
function serialToDate(s){ return new Date((s-25569)*86400000); }
function serialToIso(s){ var d=serialToDate(s); return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2); }

  if(!iso) return 'Choisir'; var t=todayIso();
  if(iso===t) return 'Aujourd’hui'; if(iso===shiftDay(t,-1)) return 'Hier';
  try{ var p=iso.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}); }catch(e){ return iso; }

function cap(s){ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
function uuid(){
  try{ if(window.crypto && crypto.getRandomValues){ var a=new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2);}).join(''); } }catch(e){}
  return (Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).slice(0,32);
}
function parseAmt(s){
  s=String(s||'').replace(/[\s  €]/g,'');
  if(s.indexOf(',')>=0 && s.indexOf('.')>=0) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');

  if(!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;

}

/* Même logique que merchantKey_/findRule_ côté serveur. */
function merchantKey(s){ return normTxt(s).replace(/[0-9]+/g,' ').replace(/[^a-z ]+/g,' ').split(' ').filter(function(w){ return w.length>=2; }).slice(0,3).join(' '); }
function findRule(desc, rules){
  var k=merchantKey(desc); if(!k) return null; var best=null;
  (rules||[]).forEach(function(r){ if((k===r.key || k.indexOf(r.key+' ')===0) && (!best || r.key.length>best.key.length)) best=r; });
  return best;
}

/* =====================================================================
   Appels serveur
   ===================================================================== */
var ACTIONS = {
  getSync:           function(){ return { action:'sync' }; },
  addTransaction:    function(p,id){ return { action:'add', payload:p, requestId:id, want:'sync' }; },
  updateTransaction: function(r,c){ return { action:'update', ref:r, changes:c, want:'sync' }; },
  deleteTransaction: function(r){ return { action:'delete', ref:r, want:'sync' }; },
  setBudgets:        function(b){ return { action:'setBudgets', budgets:b }; },
  deleteRule:        function(k){ return { action:'deleteRule', key:k }; }
};
function call(name){
  var body=ACTIONS[name].apply(null,[].slice.call(arguments,1));
  var retries = (name==='deleteTransaction' || name==='deleteRule') ? 0 : 2;   // une suppression n'est jamais rejouée
  return api(CONF, body, retries).catch(function(e){ if(e.auth) needSetup(e.message); throw e; });
}
function api(conf, body, retries){
  body.k=conf.k;
  var payload=JSON.stringify(body);
  function once(){
    return new Promise(function(resolve,reject){
      var ctrl=null; try{ ctrl=new AbortController(); }catch(e){}
      var timer=setTimeout(function(){ if(ctrl) ctrl.abort(); }, 30000);
      fetch(conf.url,{ method:'POST', body:payload, headers:{'Content-Type':'text/plain;charset=utf-8'},
                       redirect:'follow', cache:'no-store', credentials:'omit', signal: ctrl?ctrl.signal:undefined })
        .then(function(r){ return r.text().then(function(t){ return { status:r.status, text:t }; }); })
        .then(function(res){
          clearTimeout(timer); setOffline(false);
          var j=null; try{ j=JSON.parse(res.text); }catch(e){}
          if(!j){
            var er=new Error(res.status>=500 ? 'Google ne répond pas pour le moment ('+res.status+'). Réessaie.'
              : 'Réponse inattendue de Google. Vérifie le lien et que le déploiement est accessible à « Tout le monde ».');
            er.retry=res.status>=500; er.network=true; return reject(er);
          }
          if(j.success) return resolve(j.data);
          var e2=new Error(j.error||'Erreur inconnue.'); e2.auth=/jeton|Accès refusé/i.test(j.error||''); reject(e2);
        }, function(err){
          clearTimeout(timer);
          var off = navigator.onLine===false; if(off) setOffline(true);
          var e=new Error(err && err.name==='AbortError' ? 'Google met trop de temps à répondre. Réessaie.'
                         : (off ? 'Pas de connexion internet.' : 'Connexion impossible. Réessaie.'));
          e.retry=!off; e.network=true; reject(e);
        });
    });
  }
  var n=0;
  function run(){ return once().catch(function(e){ if(e.retry && n<retries){ n++; return new Promise(function(r){ setTimeout(r,700*n); }).then(run); } throw e; }); }
  return run();
}

/* ---------- ligne d'état sous le grand titre (comme « Mis à jour à l'instant » dans Mail) ---------- */
function setOffline(on){ var b=document.body.classList; if(b.contains('is-offline')!==!!on){ b.toggle('is-offline',!!on); renderStatus(); } }
var updT=null;
function setUpd(state){
  clearTimeout(updT); S.status=state||'';
  if(state==='ok') updT=setTimeout(function(){ S.status=''; renderStatus(); },1800);
  renderStatus();
}
function relTime(ts){
  if(Date.now()-ts<60000) return 'à l’instant';
  var d=new Date(ts), now=new Date();
  if(d.toDateString()===now.toDateString()) return 'à '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  try{ return 'le '+d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }catch(e){ return ''; }
}
function renderStatus(){
  var u=$('upd'); if(!u) return;
  var n=S.ops.length, off=navigator.onLine===false || document.body.classList.contains('is-offline'), txt='', cls='';
  if(n){ txt = off ? 'Hors ligne · '+n+' en attente' : 'Envoi… ('+n+')'; if(off) cls='warn'; }
  else if(off){ txt='Hors ligne · dernières données'; cls='warn'; }
  else if(S.status==='busy') txt='Actualisation…';
  else if(S.status==='ok'){ txt='À jour'; cls='ok'; }
  else if(S.syncedAt && (S.view==='home' || S.view==='hist')) txt='Mis à jour '+relTime(S.syncedAt);
  u.textContent=txt; u.className='upd'+(cls?' '+cls:'');
}

/* ---------- notification (avec action « Annuler ») ---------- */
var toastT=null;
function toast(msg,isErr,action,ms){
  var t=$('toast'), b=$('toastAct'); $('toastTxt').textContent=msg; $('toastIco').innerHTML=svgG(isErr?'exclam':'check');
  t.classList.toggle('err',!!isErr); t.classList.add('on');
  b.hidden=!action; b.onclick=null;
  if(action){ b.textContent=action.label; b.onclick=function(){ t.classList.remove('on'); clearTimeout(toastT); action.fn(); }; }
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, ms || (isErr?4000:2200));
}

/* ---------- connexion ---------- */
function parseLink(raw){
  var t=String(raw||'').trim().replace(/\s+/g,'');
  var u; try{ u=new URL(t); }catch(e){ return null; }
  if(u.protocol!=='https:' || !/(^|\.)google\.com$/.test(u.hostname) || !/\/exec$/.test(u.pathname)) return null;
  var k=u.searchParams.get('k')||'';
  if(!/^[A-Za-z0-9]{20,64}$/.test(k)) return null;
  return { url:u.origin+u.pathname, k:k };
}
function needSetup(msg){
  CONF=null; saveConf(null); S.base=null; S.sync=null; S.data=null;
  try{ localStorage.removeItem('budget:sync'); localStorage.removeItem('budget:syncedAt'); }catch(e){}
  document.body.classList.add('setup'); document.body.classList.remove('sub','scrolled');
  ['home','add','hist','set'].forEach(function(x){ $('v-'+x).classList.remove('on'); });
  $('v-setup').classList.add('on');
  $('setupErr').textContent=msg||'';
  closeSheet();
}
function trySetup(){
  var btn=$('setupBtn'); if(btn.disabled) return;
  var c=parseLink($('setupLink').value);
  if(!c){ $('setupErr').textContent='Lien invalide : il doit commencer par https://script.google.com/… et se terminer par /exec?k=ta-clé.'; return; }
  btn.disabled=true; btn.classList.add('busy'); $('setupErr').textContent='';
  api(c,{action:'sync'},1).then(function(sy){
    CONF=c; saveConf(c);
    document.body.classList.remove('setup'); $('v-setup').classList.remove('on');
    $('setupLink').value='';
    show('home'); setBase(sy); pump(); toast('Connecté');
  }).catch(function(e){ $('setupErr').textContent=e.message; })
    .then(function(){ btn.disabled=false; btn.classList.remove('busy'); });
}

function refOf(x){ return { sheet:x[0], row:x[1], serial:x[2], amount:x[3] }; }
function monthLabel(ym){ var m=+ym.slice(5,7); return cap(MONTHS_FR[m-1])+' '+ym.slice(0,4); }

/* Les opérations « prévues » (ancienne fonction) ne sont plus comptées nulle part. */
function computeDashboard(sy, ym){
  var today=todayIso();
  var sav=(sy.savings||[]).map(normTxt), isSav=function(a){ return sav.indexOf(normTxt(a))>=0; };
  var acc={}, accOrder=[];
  sy.accounts.forEach(function(a){ acc[a.name]={ name:a.name, real:a.initial, savings:isSav(a.name) }; accOrder.push(a.name); });
  var m={ income:0, expenses:0, saved:0 }, cat={}, catOrder=[], uncategorized=0;
  sy.categories.forEach(function(c){ cat[c.name]={ name:c.name, budget:c.budget, spent:0 }; catOrder.push(c.name); });
  sy.tx.forEach(function(x){
    var t=txObj(x); if(t.planned) return;
    if(t.sheet==='EXP' && acc[t.account]) acc[t.account].real-=t.amount;
    if(t.sheet==='INC' && acc[t.account]) acc[t.account].real+=t.amount;
    if(t.sheet==='TRF'){ if(acc[t.from]) acc[t.from].real-=t.amount; if(acc[t.to]) acc[t.to].real+=t.amount; }
    if(t.ym!==ym) return;
    if(t.sheet==='EXP'){ m.expenses+=t.amount; if(cat[t.category]) cat[t.category].spent+=t.amount; else uncategorized+=t.amount; }
    else if(t.sheet==='INC') m.income+=t.amount;
    else { if(isSav(t.to) && !isSav(t.from)) m.saved+=t.amount; if(isSav(t.from) && !isSav(t.to)) m.saved-=t.amount; }
  });
  var accounts=accOrder.map(function(k){ var a=acc[k]; return { name:a.name, real:r2(a.real), savings:a.savings }; });
  var categories=catOrder.map(function(k){ var c=cat[k]; return { name:c.name, budget:r2(c.budget), spent:r2(c.spent) }; });
  if(uncategorized>0) categories.push({ name:'Sans catégorie', budget:0, spent:r2(uncategorized), warning:true });
  var dim=daysIn(ym), curYm=today.slice(0,7);
  return {
    ym:ym, label:monthLabel(ym), today:today, daysInMonth:dim,
    daysElapsed: ym<curYm ? dim : (ym>curYm ? 0 : +today.slice(8,10)),
    lists:{ categories:sy.categories.map(function(c){ return c.name; }), accounts:sy.accounts.map(function(a){ return a.name; }), sources:sy.sources },
    totals:{ balance:r2(accounts.reduce(function(a,b){ return a+b.real; },0)), income:r2(m.income), expenses:r2(m.expenses), saved:r2(m.saved),
             savingsRate: m.income>0 ? Math.round((m.income-m.expenses)/m.income*1000)/1000 : null,
             budget:r2(sy.categories.reduce(function(a,c){ return a+c.budget; },0)) },
    accounts:accounts, categories:categories
  };
}

/* Historique filtré + recherche (sur le mois affiché ou sur tout). */
function amtStrings(a){ var f=a.toFixed(2); return [f, f.replace('.',','), String(r2(a)), String(r2(a)).replace('.',',')].join(' '); }
function histItems(sy, h, ym, pend){
  var toks=normTxt(h.q).split(' ').filter(Boolean);
  return sy.tx.map(txObj).filter(function(t){
    if(pend && pend[t.key]) return false;
    if(h.period==='month' && t.ym!==ym) return false;
    if(h.type!=='all' && t.sheet!==h.type) return false;
    if(h.account && t.account!==h.account && t.from!==h.account && t.to!==h.account) return false;
    if(h.category && !(t.sheet==='EXP' && t.category===h.category)) return false;
    if(toks.length){
      var hay=normTxt([t.label,t.category,t.account,t.from,t.to,t.note,t.sheet==='TRF'?'virement':'',amtStrings(t.amount)].join(' '));
      for(var i=0;i<toks.length;i++) if(hay.indexOf(toks[i])<0) return false;
    }
    return true;
  }).sort(function(a,b){ return (b.serial||0)-(a.serial||0) || (a.sheet<b.sheet?-1:a.sheet>b.sheet?1:0) || b.row-a.row; });
}
function dayTotal(items){
  var exp=0, inc=0;
  items.forEach(function(t){ if(t.planned) return; if(t.sheet==='EXP') exp+=t.amount; else if(t.sheet==='INC') inc+=t.amount; });
  if(exp>0) return { txt:eur(exp), cls:'' };
  if(inc>0) return { txt:'+'+eur(inc), cls:'inc' };
  return { txt:'', cls:'' };
}
/* Catégories les plus utilisées (pour la ligne rapide de l'écran Ajouter). */
function topCategories(sy, n){
  var cnt={}, names=sy.categories.map(function(c){ return c.name; });
  sy.tx.forEach(function(x){ if(x[0]==='EXP' && x[5]) cnt[x[5]]=(cnt[x[5]]||0)+1; });
  return names.slice().sort(function(a,b){ return (cnt[b]||0)-(cnt[a]||0) || names.indexOf(a)-names.indexOf(b); }).slice(0,n);
}
/* Suggestions de budget : moyenne des mois complets récents, sinon dépensé ce mois-ci. */
function budgetSuggestions(sy){
  var today=todayIso(), cur=today.slice(0,7), months=[shiftYm(cur,-1),shiftYm(cur,-2),shiftYm(cur,-3)];
  var spent={}, has={}, curSpent={};
  months.forEach(function(m){ spent[m]={}; });
  sy.tx.forEach(function(x){
    var t=txObj(x); if(t.planned || t.sheet!=='EXP' || !t.ym) return;
    if(spent[t.ym]){ has[t.ym]=true; spent[t.ym][t.category]=(spent[t.ym][t.category]||0)+t.amount; }
    if(t.ym===cur) curSpent[t.category]=(curSpent[t.category]||0)+t.amount;
  });
  var used=months.filter(function(m){ return has[m]; });
  var out={ basis: used.length ? 'avg' : 'cur', months:used.length, items:{} };
  sy.categories.forEach(function(c){
    var v = used.length ? used.reduce(function(a,m){ return a+(spent[m][c.name]||0); },0)/used.length : (curSpent[c.name]||0);
    out.items[c.name]={ ref:r2(v), suggested: v>0 ? Math.ceil(v/5)*5 : 0 };
  });
  return out;
}

/* =====================================================================
   Synchro + file d'envoi (« outbox »)
   - S.base : dernière copie confirmée par Google
   - S.ops  : opérations faites sur le téléphone, pas encore confirmées (gardées même si l'app est fermée)
   - S.sync : ce qu'on affiche = S.base + S.ops appliquées par-dessus → tout est instantané
   ===================================================================== */
function isoToSerial(iso){ var p=String(iso).split('-'); return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000)+25569; }
function persistOps(){ try{ localStorage.setItem('budget:outbox',JSON.stringify(S.ops)); }catch(e){} }
function loadOps(){
  try{ var o=JSON.parse(localStorage.getItem('budget:outbox')||'[]'); if(Array.isArray(o)) return o.filter(function(op){ return op && op.kind; }).map(function(op){ op.state='queued'; return op; }); }catch(e){}
  return [];
}
function applyChanges(t, c){
  if(c.amount!=null){ var a=parseAmt(c.amount); if(a>0) t[3]=r2(a); }
  if(c.date) t[2]=isoToSerial(c.date);
  if(c.description!=null) t[4]=String(c.description).trim();
  if(c.category!=null) t[5]=c.category;
  if(c.account!=null) t[6]=c.account;
  if(c.source!=null) t[4]=c.source;
  if(c.from!=null) t[7]=c.from;
  if(c.to!=null) t[8]=c.to;
  if(t[0]==='TRF' && (c.from!=null || c.to!=null)) t[4]=t[7]+' → '+t[8];
  if(c.note!=null) t[10]=String(c.note).trim();
  if(c.status==='Réel') t[9]=0;
}
function view(){
  if(!S.base){ S.sync=null; return; }
  var tx=S.base.tx.map(function(t){ return t.slice(0,11); }), idx={};
  tx.forEach(function(t,i){ idx[t[0]+':'+t[1]]=i; });
  S.ops.forEach(function(op){
    if(op.kind==='add'){ var n=op.tuple.slice(); n[11]=1; tx.push(n); }
    else if(op.kind==='update'){ var i=idx[op.key]; if(i!=null && tx[i]){ applyChanges(tx[i],op.changes); tx[i][11]=1; } }
    else if(op.kind==='delete'){ var j=idx[op.key]; if(j!=null) tx[j]=null; }
  });
  S.sync={}; for(var k in S.base) S.sync[k]=S.base[k];
  S.sync.tx=tx.filter(Boolean);
}
function recompute(){ view(); if(S.sync){ S.data=computeDashboard(S.sync,S.ym); S.loadError=null; } renderAll(); queueStatus(); }
function setBase(sy){
  if(!sy || !sy.tx) return;
  S.base=sy; S.syncedAt=Date.now(); store('syncedAt',String(S.syncedAt));
  try{ localStorage.setItem('budget:sync',JSON.stringify(sy)); }catch(e){}
  recompute();
}
function load(force){
  if(!CONF){ needSetup(); return; }
  if(!S.base){ try{ var c=JSON.parse(localStorage.getItem('budget:sync')||'null'); if(c && c.tx) S.base=c; }catch(e){} }
  if(!S.syncedAt){ S.syncedAt=+(store('syncedAt')||0); }
  recompute(); pump();
  if(!force && S.base && Date.now()-S.syncedAt < 30000) return;
  if(S.loading) return;
  var my=++S.seq; S.loading=true; if(!S.ops.length) setUpd('busy');
  call('getSync').then(function(sy){
    if(my!==S.seq) return;
    if(S.sending) return;                       // une opération est en vol : sa réponse apportera des données fraîches
    setBase(sy); if(!S.ops.length) setUpd('ok');
  }).catch(function(e){ if(my!==S.seq) return; if(!S.ops.length) setUpd(''); S.loadError=e.message; if(S.data && !e.network) toast(e.message,true); renderAll(); })
    .then(function(){ if(my===S.seq) S.loading=false; });
}
function changeMonth(d){
  S.ym=shiftYm(S.ym,d); recompute();
  if(!S.loading && (!S.syncedAt || Date.now()-S.syncedAt>120000)) load();
}

/* ---------- file d'envoi ---------- */
function enqueue(op){
  op.id=op.id||uuid(); op.state='queued'; op.tries=0; op.at=Date.now();
  S.ops.push(op); persistOps(); recompute(); pump();
}
function queueStatus(){
  if(!S.ops.length && S.hadOps){ S.hadOps=false; setUpd('ok'); return; }
  if(S.ops.length) S.hadOps=true;
  renderStatus();
}
function pump(){
  if(S.sending || !CONF) return;
  var op=S.ops[0]; queueStatus();
  if(!op) return;
  var wait=(op.notBefore||0)-Date.now();
  if(wait>0){ clearTimeout(S.pumpT); S.pumpT=setTimeout(pump, wait+30); return; }
  if(navigator.onLine===false) return;
  S.sending=true; op.state='sending'; op.tries=(op.tries||0)+1; persistOps();
  var p = op.kind==='add' ? call('addTransaction', op.payload, op.reqId)
        : op.kind==='update' ? call('updateTransaction', op.ref, op.changes)
        : call('deleteTransaction', op.ref);
  p.then(function(res){
    S.ops.shift(); persistOps(); S.sending=false; S.retry=0;
    if(res && res.sync) setBase(res.sync); else recompute();
    if(op.kind==='update' && res && res.learned) toast('« '+cap(res.learned.key)+' » → '+res.learned.category+' retenu', false, null, 2600);
    pump();
  }).catch(function(e){
    S.sending=false; op.state='queued';
    if(e.auth){ persistOps(); return; }                                   // nouvelle clé demandée : on garde la file
    if(e.network){                                                         // réseau / Google indisponible : on réessaie plus tard
      S.retry=Math.min((S.retry||0)+1,6); persistOps(); queueStatus();
      clearTimeout(S.pumpT); S.pumpT=setTimeout(pump, 1500*S.retry); return;
    }
    S.ops.shift(); persistOps();
    var already = (op.beaconed || op.tries>1) && /modifi|introuvable|hors de la zone/i.test(e.message);
    if(!already) toast({ add:'Non enregistré : ', update:'Modification refusée : ', delete:'Suppression refusée : ' }[op.kind]+e.message, true, null, 5000);
    recompute(); load(true); pump();
  });
}
/* L'app passe en arrière-plan : on envoie tout de suite ce qui attend (sans attendre de réponse).
   Les opérations restent dans la file : si l'envoi a réussi, le renvoi est reconnu comme doublon. */
function flushOps(){
  if(!CONF || navigator.onLine===false || !S.ops.length) return;
  S.ops.forEach(function(op){
    if(op.state==='sending') return;
    var body = op.kind==='add' ? { action:'add', payload:op.payload, requestId:op.reqId }
             : op.kind==='update' ? { action:'update', ref:op.ref, changes:op.changes }
             : { action:'delete', ref:op.ref };
    body.k=CONF.k; body=JSON.stringify(body);
    var ok=false;
    try{ ok=!!(navigator.sendBeacon && navigator.sendBeacon(CONF.url, new Blob([body],{type:'text/plain;charset=UTF-8'}))); }catch(e){}
    if(!ok){ try{ fetch(CONF.url,{ method:'POST', body:body, headers:{'Content-Type':'text/plain;charset=utf-8'}, keepalive:true, credentials:'omit', mode:'no-cors' }); ok=true; }catch(e){} }
    if(ok){ op.beaconed=true; op.notBefore=0; }
  });
  persistOps();
}

/* ---------- suppression avec « Annuler » ---------- */
function isPendingAdd(x){ return typeof x[1]==='string' && x[1].indexOf('tmp-')===0; }
function deleteTx(x){
  store('swipeHint','1');
  if(isPendingAdd(x)){                                   // pas encore envoyée : on annule simplement l'envoi
    var id=x[1].slice(4), i=S.ops.findIndex(function(o){ return o.kind==='add' && o.id===id; });
    if(i>=0 && S.ops[i].state!=='sending'){ S.ops.splice(i,1); persistOps(); recompute(); toast('Opération supprimée'); }
    else { recompute(); toast('Envoi en cours… réessaie dans un instant', true); }
    return;
  }
  var key=x[0]+':'+x[1];
  if(S.ops.some(function(o){ return o.kind==='delete' && o.key===key; })) return;
  var op={ kind:'delete', key:key, ref:refOf(x), notBefore:Date.now()+4500, id:uuid() };
  enqueue(op);
  toast('Opération supprimée', false, { label:'Annuler', fn:function(){
    var i=S.ops.indexOf(op);
    if(i>=0 && op.state!=='sending' && !op.beaconed){ S.ops.splice(i,1); persistOps(); recompute(); toast('Suppression annulée'); }
    else toast('Trop tard : déjà supprimée', true);
  } }, 4500);
}

function closeOpenRow(except){
  var w=S.openRow; if(!w || w===except) return;
  w.classList.remove('open'); var it=w.querySelector('.item'); if(it) it.style.transform=''; S.openRow=null;
}
function collapse(wrap,done){
  closeOpenRow();
  var it=wrap.querySelector('.item'); if(it) it.style.transform='translateX('+wrap.offsetWidth+'px)';
  wrap.style.height=wrap.offsetHeight+'px'; void wrap.offsetHeight;
  wrap.classList.add('gone'); wrap.style.height='0px';
  setTimeout(done,230);
}
function makeSwipe(wrap,item,onDelete,onTap){
  var id=null, x0=0, y0=0, dx=0, mode=null, start=0, W=0, moved=false;
  item.addEventListener('pointerdown',function(e){
    if(e.button>0) return; closeOpenRow(wrap);
    id=e.pointerId; x0=e.clientX; y0=e.clientY; dx=0; mode=null; moved=false;
    W=wrap.offsetWidth; start=wrap.classList.contains('open') ? OPEN_W : 0;
  });
  item.addEventListener('pointermove',function(e){
    if(e.pointerId!==id) return;
    var mx=e.clientX-x0, my=e.clientY-y0;
    if(!mode){
      if(Math.abs(mx)>8 && Math.abs(mx)>Math.abs(my)*1.2){ mode='h'; moved=true; wrap.classList.add('drag'); try{ item.setPointerCapture(id); }catch(_){} }
      else if(Math.abs(my)>8){ mode='v'; moved=true; }
    }
    if(mode==='h'){ dx=Math.max(0,Math.min(W,start+mx)); item.style.transform='translateX('+dx+'px)'; e.preventDefault(); }
  });
  function end(e){
    if(e.pointerId!==id) return; id=null; wrap.classList.remove('drag');
    if(mode==='h'){
      if(dx>W*0.5){ onDelete(); }
      else if(dx>44){ wrap.classList.add('open'); item.style.transform='translateX('+OPEN_W+'px)'; S.openRow=wrap; }
      else { wrap.classList.remove('open'); item.style.transform=''; if(S.openRow===wrap) S.openRow=null; }
    }
    mode=null;
  }
  item.addEventListener('pointerup',end);
  item.addEventListener('pointercancel',function(e){ if(e.pointerId!==id) return; id=null; wrap.classList.remove('drag'); if(mode==='h' && !wrap.classList.contains('open')) item.style.transform=''; mode=null; });
  item.addEventListener('click',function(e){
    if(moved){ moved=false; e.preventDefault(); return; }
    if(wrap.classList.contains('open')){ wrap.classList.remove('open'); item.style.transform=''; S.openRow=null; return; }
    onTap();
  });
}

  var g2=el('div','grp'); g2.style.marginTop='20px';
  var dl=el('span','pillv',shortDate(v.date)), dt=el('input'); dt.type='date'; dt.id='eDate'; dt.value=v.date; dt.setAttribute('aria-label','Date');
  dt.onchange=dt.oninput=function(){ v.date=dt.value; dl.textContent=shortDate(dt.value); refreshEditNav(); };
  g2.appendChild(dateRow(dt,dl));
  if(t.sheet!=='EXP'){ var ni=el('input'); ni.id='eNote'; ni.maxLength=120; ni.placeholder='Optionnel'; ni.value=v.note; ni.oninput=function(){ v.note=ni.value; refreshEditNav(); }; g2.appendChild(inputRow('Note',ni)); }
  sh.appendChild(g2);
  var g3=el('div','grp'), del=el('button','row danger del-row'+(E.armed?' armed':'')); del.type='button';
  del.appendChild(el('span','k', E.armed ? 'Confirmer la suppression' : 'Supprimer l’opération'));
  del.onclick=function(){ if(!E.armed){ E.armed=true; renderEdit(); return; } var x=t.x; closeSheet(); deleteTx(x); };
  g3.appendChild(del); g3.style.marginTop='20px'; sh.appendChild(g3);
  sh.scrollTop=keepScroll;
}
function refreshEditNav(){
  var E=S.edit; if(!E) return; var btn=$('sheet').querySelector('.sh-nav .strong');
  var ch=editChanges(); if(btn) btn.disabled = E.busy || !Object.keys(ch).length || !!editError(ch);
}
function saveEdit(forced){
  var E=S.edit; if(!E) return;
  var ch = forced && !forced.target ? forced : editChanges();
  var err=editError(ch); if(err){ toast(err,true); return; }
  if(!Object.keys(ch).length) return;
  var x=E.t.x;
  closeSheet();
  enqueue({ kind:'update', key:x[0]+':'+x[1], ref:refOf(x), changes:ch });     // visible tout de suite
  toast('Modifié');
}

/* Filtres */
function openFilters(){ renderFilters(); openSheetEl(); }
function renderFilters(){
  var sh=$('sheet'), h=S.h, L=lists();
  sh.innerHTML=''; sh.appendChild(el('div','grab'));
  sh.appendChild(navBar({ label:'Réinitialiser', fn:function(){ S.h.period='month'; S.h.type='all'; S.h.account=''; S.h.category=''; afterFilter(); } }, 'Filtres', { label:'OK', icon:'check', fn:closeSheet }).el);
  function seg(cls, opts, cur, set){
    var s=el('div','seg '+cls); opts.forEach(function(o){ var b=el('button',null,o[1]); b.type='button'; b.setAttribute('aria-pressed',o[0]===cur?'true':'false'); b.onclick=function(){ set(o[0]); afterFilter(); }; s.appendChild(b); }); return s;
  }
  sh.appendChild(el('div','gh','Période'));
  sh.appendChild(seg('seg2',[['month',monthLabel(S.ym)],['all','Tous les mois']],h.period,function(x){ h.period=x; }));
  sh.appendChild(el('div','gh','Type'));
  sh.appendChild(seg('seg4',[['all','Tout'],['EXP','Dépenses'],['INC','Revenus'],['TRF','Virements']],h.type,function(x){ h.type=x; if(x!=='EXP' && x!=='all') h.category=''; }));
  var g=el('div','grp'); g.style.marginTop='24px';
  g.appendChild(frow('Compte', h.account||'Tous', function(){
    openPicker({ title:'Compte', items:[{ v:'', label:'Tous les comptes' }].concat(L.accounts.map(function(a){ return { v:a, label:a, kind:'acct' }; })), selected:h.account,
      onPick:function(x){ h.account=x; afterFilter(); } });
  }, !!h.account, h.account ? acctIcon(h.account) : null));
  g.appendChild(frow('Catégorie', h.category||'Toutes', function(){
    openPicker({ title:'Catégorie', items:[{ v:'', label:'Toutes les catégories' }].concat(L.categories.map(function(c){ return { v:c, label:c, kind:'cat' }; })), selected:h.category, search:true,
      onPick:function(x){ h.category=x; if(x && h.type!=='all' && h.type!=='EXP') h.type='EXP'; afterFilter(); } });
  }, !!h.category, h.category ? catIcon(h.category) : null));
  sh.appendChild(g);
}
function afterFilter(){ updateChrome(); renderHist(); if($('sheet').classList.contains('on') && !S.edit) renderFilters(); }

/* ---------- Réglages ---------- */
function navRow(glyph, color, label, value, fn){
  var b=el('button','row frow ic'); b.type='button'; b.appendChild(tile(glyph,color)); b.appendChild(el('span','k',label));
  var v=el('span','v'); v.appendChild(el('span','t num',value||'')); v.insertAdjacentHTML('beforeend',CHEV); b.appendChild(v); b.onclick=fn; return b;
}
function infoRow(label, value){ var r=el('div','row'); r.appendChild(el('span','k',label)); r.appendChild(el('span','v num',value)); return r; }
function actionRow(label, cls, fn){ var b=el('button','row '+cls); b.type='button'; b.appendChild(el('span','k',label)); b.onclick=fn; return b; }
function goBudgets(){ S.view='set'; showView('set'); S.setPage='budgets'; S.budgetDraft=null; renderSet(); updateChrome(); window.scrollTo(0,0); }
function goRules(){ S.setPage='rules'; renderSet(); updateChrome(); window.scrollTo(0,0); }
function goSetMain(){ S.setPage='main'; renderSet(); updateChrome(); window.scrollTo(0,0); }
function renderSet(){
  var host=$('set'); host.innerHTML='';
  if(!S.sync){ if(S.loadError) errorBox(host); else skeleton(host,[88,104,210]); return; }
  if(S.setPage==='budgets') return renderBudgets(host);
  if(S.setPage==='rules') return renderRules(host);
  var sy=S.sync, tot=sy.categories.reduce(function(a,c){ return a+c.budget; },0), nr=(sy.rules||[]).length;
  var off=document.body.classList.contains('is-offline') || navigator.onLine===false;
  var ac=el('div','grp appcard'), img=el('img'); img.src='icon-180.png'; img.alt=''; ac.appendChild(img);
  var at=el('div'); at.appendChild(el('b',null,'Budget')); var sm=el('small'); sm.appendChild(el('i',off?'off':''));
  sm.appendChild(document.createTextNode(off ? 'Hors ligne' : 'Relié à ton Google Sheet')); at.appendChild(sm); ac.appendChild(at);
  host.appendChild(ac);

  var g1=el('div','grp');
  g1.appendChild(navRow('pie','#5856d6','Budgets mensuels',eurR(tot)+' / mois',goBudgets));
  g1.appendChild(navRow('sparkles','#af52de','Catégories apprises',String(nr),goRules));
  host.appendChild(g1);
  host.appendChild(el('p','gf','Quand tu corriges la catégorie d’un marchand, l’app la retient pour tes prochains paiements Apple Pay.'));

  var last = S.syncedAt ? new Date(S.syncedAt).toLocaleString('fr-FR',{ day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
  host.appendChild(el('div','gh','Données'));
  var g2=el('div','grp');
  g2.appendChild(actionRow('Actualiser maintenant','link',function(){ S.retry=0; pump(); load(true); }));
  g2.appendChild(infoRow('Dernière mise à jour',last));
  g2.appendChild(infoRow('Opérations enregistrées',String(sy.tx.length)));
  g2.appendChild(infoRow('En attente d’envoi',String(S.ops.length)));
  host.appendChild(g2);

  host.appendChild(el('div','gh','Connexion'));
  var g3=el('div','grp'); g3.appendChild(actionRow('Changer de lien ou de clé','danger',function(){ needSetup(''); })); host.appendChild(g3);
  host.appendChild(el('p','gf','Ton lien et ta clé restent uniquement sur ce téléphone.'));
  host.appendChild(el('p','ver','Budget · version '+VERSION));
}
function renderBudgets(host){
  var sy=S.sync, sug=budgetSuggestions(sy);
  if(!S.budgetDraft){ S.budgetDraft={}; sy.categories.forEach(function(c){ S.budgetDraft[c.name]=amtInput(c.budget); }); }
  var D=S.budgetDraft;
  var ap=el('div','grp'), apb=el('button','row link'); apb.type='button'; apb.id='budApply';
  apb.appendChild(el('span','k','Appliquer les suggestions'));
  apb.onclick=function(){ sy.categories.forEach(function(c){ D[c.name]=amtInput(sug.items[c.name].suggested); }); renderSet(); };
  ap.appendChild(apb); host.appendChild(ap);
  host.appendChild(el('p','gf', sug.basis==='avg'
    ? 'Sous chaque catégorie : ta moyenne de dépenses sur '+(sug.months>1 ? 'les '+sug.months+' derniers mois complets' : 'le dernier mois complet')+', et une suggestion arrondie aux 5 € supérieurs.'
    : 'Pas encore de mois complet : sous chaque catégorie, tu vois ce que tu as dépensé ce mois-ci et une suggestion arrondie aux 5 € supérieurs. Elle deviendra une vraie moyenne dès le mois prochain.'));
  host.appendChild(el('div','gh','Par catégorie'));
  var g=el('div','grp');
  sy.categories.forEach(function(c){
    var row=el('div','bud-row'); row.appendChild(catIcon(c.name));
    var nm=el('div','nm'); nm.appendChild(el('b',null,c.name));
    var it=sug.items[c.name], sm=el('small');
    sm.appendChild(document.createTextNode(eur(it.ref)+(it.suggested && it.suggested!==c.budget ? ' · ' : '')));
    if(it.suggested && it.suggested!==c.budget){ var a=el('a',null,'utiliser '+eurR(it.suggested)); a.href='#'; a.onclick=function(e){ e.preventDefault(); D[c.name]=amtInput(it.suggested); renderSet(); }; sm.appendChild(a); }
    nm.appendChild(sm); row.appendChild(nm);
    var v=parseAmt(D[c.name]); var isCh = !(Math.abs((isNaN(v)?-1:v)-c.budget)<0.005);
    var box=el('label','bud-in'+(isCh?' changed':'')), inp=el('input'); inp.inputMode='decimal'; inp.value=D[c.name]; inp.setAttribute('aria-label','Budget '+c.name);
    inp.oninput=function(){ D[c.name]=inp.value; var vv=parseAmt(inp.value); box.classList.toggle('changed', !(Math.abs((isNaN(vv)?-1:vv)-c.budget)<0.005)); updateSave(); };
    box.appendChild(inp); box.appendChild(el('span',null,'€')); row.appendChild(box); g.appendChild(row);
  });
  host.appendChild(g);
  var tl=el('p','gf num'); tl.id='budTotal'; host.appendChild(tl);
  var save=el('button','cta sticky-save'); save.type='button'; save.id='budSave';
  save.appendChild(el('span','txt','Enregistrer')); save.appendChild(el('span','spin')); host.appendChild(save);
  function updateSave(){
    var n=0, bad=false, tot=0;
    sy.categories.forEach(function(c){ var vv=parseAmt(D[c.name]); if(D[c.name]==='' ) vv=0; if(isNaN(vv)) bad=true; else { tot+=vv; if(!(Math.abs(vv-c.budget)<0.005)) n++; } });
    $('budTotal').textContent='Total : '+eurR(tot)+' / mois'+(n? ' · '+n+' modification'+(n>1?'s':''):'');
    save.disabled = bad || !n || S.busy; save.classList.toggle('idle', !n && !bad && !S.busy);
    save.querySelector('.txt').textContent = bad ? 'Montant invalide' : (n ? 'Enregistrer ('+n+')' : 'Enregistrer');
  }
  save.onclick=function(){
    if(save.disabled) return;
    var list=[]; sy.categories.forEach(function(c){ var vv=D[c.name]==='' ? 0 : parseAmt(D[c.name]); if(!(Math.abs(vv-c.budget)<0.005)) list.push([c.name, vv]); });
    S.busy=true; save.classList.add('busy'); save.disabled=true;
    call('setBudgets', list).then(function(res){ S.budgetDraft=null; if(!S.sending) setBase(res.sync); toast('Budgets enregistrés'); })
      .catch(function(e){ toast(e.message,true); })
      .then(function(){ S.busy=false; if(S.setPage==='budgets') renderSet(); });
  };
  updateSave();
}
function renderRules(host){
  var rules=(S.sync.rules||[]).slice().sort(function(a,b){ return a.key<b.key?-1:1; });
  host.appendChild(el('p','gf','Chaque paiement Apple Pay chez ces marchands reçoit automatiquement la catégorie indiquée. Glisse vers la droite pour oublier un marchand.')).style.margin='0 16px 20px';
  if(!rules.length){ var e=el('div','grp'); emptyState(e,'sparkles','Aucun marchand','Corrige une catégorie dans l’Historique : le marchand apparaîtra ici.'); host.appendChild(e); return; }
  var g=el('div','grp list');
  rules.forEach(function(r){
    var wrap=el('div','sw rule-row'), bin=el('button','bin'); bin.type='button'; bin.setAttribute('aria-label','Oublier '+r.key);
    var bs=el('span'); bs.innerHTML=svgG('trash'); bin.appendChild(bs);
    var item=el('div','item'); item.appendChild(catIcon(r.category,'l'));
    var m=el('div','m'); m.appendChild(el('b',null,r.key)); var sm=el('small'); sm.appendChild(el('span',null,r.example ? 'ex. '+r.example : '')); m.appendChild(sm); item.appendChild(m);
    item.appendChild(el('span','pill',r.category));
    wrap.appendChild(bin); wrap.appendChild(item);
    var forget=function(){ collapse(wrap,function(){
      call('deleteRule', r.key).then(function(res){ if(!S.sending) setBase(res.sync); toast('« '+cap(r.key)+' » oublié'); })
        .catch(function(e){ toast(e.message,true); renderSet(); });
    }); };
    makeSwipe(wrap,item,forget,function(){}); bin.onclick=forget;
    g.appendChild(wrap);
  });
  host.appendChild(g);
}

/* ---------- navigation ---------- */
var TITLES={ home:'Budget', add:'Ajouter', hist:'Historique', set:'Réglages' };
function pageTitle(){
  if(S.view==='set' && S.setPage==='budgets') return 'Budgets mensuels';
  if(S.view==='set' && S.setPage==='rules') return 'Catégories apprises';
  return TITLES[S.view];
}
function updateChrome(){
  var t=pageTitle(), sub=S.view==='set' && S.setPage!=='main', monthShown = S.view==='home' || (S.view==='hist' && S.h.period!=='all');
  $('title').textContent=t; $('navTitle').textContent=t;
  $('navSub').textContent = monthShown ? monthLabel(S.ym) : '';
  $('navBack').hidden=!sub; document.body.classList.toggle('sub',sub);
  document.body.classList.toggle('no-month', !monthShown);
}
function showView(v){
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.setAttribute('aria-selected', b.dataset.v===v?'true':'false'); });
  ['home','add','hist','set'].forEach(function(x){ $('v-'+x).classList.toggle('on',x===v); });
}
function show(v){
  if(S.view==='set' && v==='set'){ S.setPage='main'; }
  S.view=v; closeOpenRow(); showView(v); updateChrome();
  if(v==='set') renderSet();
  if(v==='add') fitInput($('amt'));
  renderStatus();
  window.scrollTo(0,0); onScroll(); store('view',v);
}
function onScroll(){
  var s=window.scrollY>34;
  if(s!==S.scrolled){ S.scrolled=s; document.body.classList.toggle('scrolled',s); }
}

/* ---------- événements ---------- */
document.querySelector('.tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b && b.dataset.v) show(b.dataset.v); });
$('navBack').addEventListener('click',goSetMain);
$('typeSeg').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; S.f.type=b.dataset.t; S.reqId=null; store('type',S.f.type); renderForm(); });
$('submit').addEventListener('click',submit);
$('form').addEventListener('submit',function(e){ e.preventDefault(); submit(); });
$('form').addEventListener('input',function(){ S.reqId=null; });
$('amt').addEventListener('input',function(){ fitInput($('amt')); });
$('desc').addEventListener('input',suggestCategory);
$('date').addEventListener('input',function(){ $('dateLbl').textContent=shortDate($('date').value); });
$('date').addEventListener('change',function(){ $('dateLbl').textContent=shortDate($('date').value); });
$('amt').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); if(S.f.type==='EXP') $('desc').focus(); else $('amt').blur(); } });
$('prev').addEventListener('click',function(){ changeMonth(-1); });
$('next').addEventListener('click',function(){ changeMonth(1); });
$('q').addEventListener('input',function(){ S.h.q=$('q').value; renderHist(); });
$('qclr').addEventListener('click',function(){ $('q').value=''; S.h.q=''; renderHist(); $('q').focus(); });
$('fbtn').addEventListener('click',openFilters);
$('backdrop').addEventListener('click',function(){ if(!(S.edit && S.edit.busy)) closeSheet(); });
$('pback').addEventListener('click',closePicker);
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if($('picker').classList.contains('on')) closePicker(); else if(!(S.edit && S.edit.busy)) closeSheet(); } });
document.addEventListener('pointerdown',function(e){ if(S.openRow && !S.openRow.contains(e.target)) closeOpenRow(); },true);
window.addEventListener('scroll',function(){ closeOpenRow(); onScroll(); },{ passive:true });
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){ flushOps(); }
  else if(CONF){ pump(); load(); renderStatus(); }
});
window.addEventListener('pagehide',function(){ flushOps(); });
window.addEventListener('pageshow',function(e){ if(e.persisted && CONF) load(); });
window.addEventListener('online',function(){ setOffline(false); if(CONF){ S.retry=0; pump(); load(true); } });
window.addEventListener('offline',function(){ setOffline(true); queueStatus(); });
$('setupBtn').addEventListener('click',trySetup);
$('setupLink').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); trySetup(); } });
document.addEventListener('dblclick',function(e){ e.preventDefault(); },{passive:false});
setInterval(function(){ if(document.visibilityState==='visible') renderStatus(); }, 30000);

/* ---------- démarrage ---------- */
$('date').value=todayIso();
var t0=store('type'); if(t0 && TYPES[t0]) S.f.type=t0;
S.f.acct=store('acct')||'';
S.ops=loadOps();
if(CONF){ var v0=store('view'); show(v0==='add'||v0==='hist'||v0==='set' ? v0 : 'home'); load(); }
else needSetup('');
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

/* exposé pour les tests automatiques uniquement */
window.__budget={ computeDashboard:computeDashboard, histItems:histItems, dayTotal:dayTotal, budgetSuggestions:budgetSuggestions, topCategories:topCategories,
  merchantKey:merchantKey, findRule:findRule, catMeta:catMeta, parseAmt:parseAmt, S:S, pump:pump };
})();
