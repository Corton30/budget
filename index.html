<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com" crossorigin="anonymous">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin="anonymous">
<title>Budget</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32); --sep:rgba(60,60,67,.16);
  --blue:#007aff; --green:#248a3d; --green-ui:#34c759; --red:#d70015; --red-ui:#ff3b30;
  --orange:#c93400; --orange-ui:#ff9500; --indigo:#5856d6;
  --glass:rgba(249,249,249,.72); --glass-line:rgba(0,0,0,.08);
  --shadow:0 1px 1px rgba(0,0,0,.03),0 6px 20px rgba(0,0,0,.05);
  --on-accent:#fff;
  --safe-t:max(env(safe-area-inset-top),14px);
  --safe-b:max(env(safe-area-inset-bottom),12px);
  --safe-l:env(safe-area-inset-left); --safe-r:env(safe-area-inset-right);
  --tab-h:58px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1c1c1e; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
    --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
    --blue:#0a84ff; --green:#30d158; --green-ui:#30d158; --red:#ff453a; --red-ui:#ff453a;
    --orange:#ff9f0a; --orange-ui:#ff9f0a; --indigo:#7d7aff;
    --glass:rgba(28,28,30,.72); --glass-line:rgba(255,255,255,.08);
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- En-tête (verre) ---------- */
.top{position:sticky;top:0;z-index:20;padding:var(--safe-t) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--glass-line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:600px;margin:0 auto}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.month{display:flex;align-items:center;background:var(--fill);border-radius:999px;padding:2px}
.month button{width:44px;height:44px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;color:var(--blue)}
.month button:active{background:var(--fill2)}
.month span{min-width:118px;text-align:center;font-size:15px;font-weight:600}
.sync{width:16px;height:16px;border-radius:50%;border:2px solid var(--label3);border-top-color:var(--blue);
  animation:spin .8s linear infinite;opacity:0;transition:opacity .2s}
.sync.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Mise en page ---------- */
main{max-width:600px;margin:0 auto;padding:14px calc(16px + var(--safe-r)) calc(var(--tab-h) + var(--safe-b) + 28px) calc(16px + var(--safe-l));
  -webkit-overflow-scrolling:touch}
.view{display:none}.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;margin:24px 4px 8px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{padding:14px 16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.kpi.hero{grid-column:1/-1;min-height:118px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--label2)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.b-inc{color:var(--green)}.b-exp{color:var(--red)}.b-sav{color:var(--indigo)}.b-bal{color:var(--blue)}
.kpi .v{font-size:24px;font-weight:700;margin-top:6px}
.kpi.hero .v{font-size:38px;letter-spacing:-.025em}
.kpi .s{font-size:13px;color:var(--label2);margin-top:4px;min-height:17px}
.neg{color:var(--red)!important}
.rate{height:6px;background:var(--fill);border-radius:3px;margin-top:8px;overflow:hidden}
.rate i{display:block;height:100%;background:var(--indigo);border-radius:3px;transition:width .5s ease}

.accts{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:calc(16px + var(--safe-l));margin:12px calc(-16px - var(--safe-r)) 0 calc(-16px - var(--safe-l));
  padding:2px calc(16px + var(--safe-r)) 4px calc(16px + var(--safe-l));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.accts::-webkit-scrollbar{display:none}
.acct{flex:0 0 auto;min-width:132px;padding:12px 14px;scroll-snap-align:start}
.acct small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label2);font-weight:500}
.acct b{display:block;font-size:18px;margin-top:4px}
.acct .p{font-size:12px;color:var(--label2);margin-top:2px}

/* ---------- Budgets ---------- */
.bud-head{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bud-head b{font-size:17px}.bud-head span{font-size:13px;color:var(--label2)}
.bar{height:8px;background:var(--fill);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .5s ease}
.bar i.warn{background:var(--orange-ui)}.bar i.over{background:var(--red-ui)}
.bud-total{padding:6px 16px 12px}
.cat{padding:12px 16px;border-top:.5px solid var(--sep)}
.cat .r1{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px}
.cat .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .a{font-size:15px;white-space:nowrap}
.cat .a em{font-style:normal;color:var(--label2)}
.cat .r3{font-size:13px;color:var(--label2);margin-top:6px}
.cat .r3.over{color:var(--red)}.cat .r3.warn{color:var(--orange)}
.more{width:100%;min-height:48px;border:0;background:transparent;color:var(--blue);font-size:15px;font-weight:500;border-top:.5px solid var(--sep)}

/* ---------- Saisie ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{min-height:40px;border:0;background:transparent;border-radius:9px;font-size:15px;font-weight:600;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
@media (prefers-color-scheme: dark){.seg button[aria-pressed="true"]{background:#636366}}
.form{padding:16px}
.amount{display:flex;align-items:baseline;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--sep)}
.amount input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0;font-size:48px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.amount input::placeholder{color:var(--label3)}
.amount span{font-size:32px;font-weight:600;color:var(--label2)}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--label2);margin:18px 2px 8px}
.field{width:100%;min-height:48px;border:0;background:var(--fill);border-radius:12px;padding:12px 14px;font-size:17px;-webkit-appearance:none;appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border:0;background:var(--fill);border-radius:999px;padding:0 16px;font-size:15px;font-weight:500}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--on-accent);font-weight:600}
.pair{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.toggle{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:12px;padding:3px;min-height:48px}
.toggle button{border:0;background:transparent;border-radius:9px;padding:0 14px;font-size:15px;font-weight:600;min-width:64px}
.toggle button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
@media (prefers-color-scheme: dark){.toggle button[aria-pressed="true"]{background:#636366}}
.submit{position:relative;width:100%;min-height:56px;margin-top:16px;border:0;border-radius:16px;font-size:18px;font-weight:600;
  color:var(--on-accent);background:var(--red-ui);transition:transform .1s,opacity .2s}
.submit.INC{background:var(--green-ui)}.submit.TRF{background:var(--indigo)}
.submit:active{transform:scale(.985)}
.submit[disabled]{opacity:.6}
.submit .spin{display:none;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;
  animation:spin .8s linear infinite;position:absolute;left:50%;top:50%;margin:-10px 0 0 -10px}
.submit.busy .txt{visibility:hidden}.submit.busy .spin{display:block}
@media (prefers-color-scheme: dark){.submit.INC{color:#000}}
.hint{font-size:13px;color:var(--label2);margin:10px 4px 0;text-align:center}

/* ---------- Historique ---------- */
.day{font-size:13px;font-weight:600;color:var(--label2);margin:20px 4px 6px;text-transform:capitalize}
.list{overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 16px;border:0;background:transparent;text-align:left}
.item+.item{border-top:.5px solid var(--sep)}
.item:active{background:var(--fill)}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;font-size:16px;font-weight:700}
.ico.EXP{background:var(--red-ui)}.ico.INC{background:var(--green-ui)}.ico.TRF{background:var(--indigo)}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m small{display:block;font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600;white-space:nowrap}
.amt.INC{color:var(--green)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 6px;border-radius:6px;
  background:color-mix(in srgb,var(--orange-ui) 18%,transparent);color:var(--orange);margin-left:6px;vertical-align:1px}
.empty{padding:28px 16px;text-align:center;color:var(--label2);font-size:15px}

/* ---------- Barre d'onglets (verre) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px calc(8px + var(--safe-r)) var(--safe-b) calc(8px + var(--safe-l));
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--glass-line)}
.tabs button{min-height:var(--tab-h);border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--label2)}
.tabs button[aria-selected="true"]{color:var(--blue)}
.tabs svg{width:26px;height:26px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 6px);z-index:60;transform:translate(-50%,-160%);
  display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:12px 18px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  box-shadow:0 10px 30px rgba(0,0,0,.18);border:.5px solid var(--glass-line);font-size:15px;font-weight:600;
  transition:transform .38s cubic-bezier(.2,.9,.25,1.2)}
.toast.on{transform:translate(-50%,0)}
.toast .ti{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;background:var(--green-ui)}
.toast.err .ti{background:var(--red-ui)}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Feuille d'action ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.36);opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:600px;margin:0 auto;background:var(--bg);
  border-radius:22px 22px 0 0;padding:8px calc(16px + var(--safe-r)) calc(var(--safe-b) + 12px) calc(16px + var(--safe-l));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--label3);margin:2px auto 12px}
.sh-title{text-align:center;padding:4px 0 14px}
.sh-title b{display:block;font-size:28px;font-weight:700}
.sh-title small{color:var(--label2);font-size:14px}
.sh-group{padding:4px 16px 16px}
.sh-btn{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--card);font-size:17px;font-weight:600;margin-top:10px}
.sh-btn.danger{color:var(--red)}.sh-btn.danger.armed{background:var(--red-ui);color:#fff}
.sh-btn.plain{color:var(--blue)}

/* ---------- Squelette ---------- */
.sk{background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 50%,var(--fill) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:20px}
@keyframes sh{to{background-position:-200% 0}}
.err-box{padding:18px 16px;text-align:center}
.err-box p{margin:0 0 12px;color:var(--label2)}
.retry{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:600}

body.setup .tabs,body.setup .month,body.setup .sync{display:none}
.setup-card{padding:20px}
.setup-card h2{margin:0 0 6px;font-size:22px}
.setup-card p{margin:0 0 14px;color:var(--label2);font-size:15px;line-height:1.4}
.setup-err{color:var(--red);font-size:14px;min-height:18px;margin:10px 2px 0}
.linkbtn{display:block;margin:22px auto 0;min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--label2);font-size:14px;text-decoration:underline}
.offline{display:none;text-align:center;font-size:13px;font-weight:600;color:var(--orange);padding:6px 0 0}
body.is-offline .offline{display:block}
.ttl{min-width:0}
.upd{font-size:12px;font-weight:500;color:var(--label2);height:15px;line-height:15px;margin-top:1px;transition:opacity .5s;white-space:nowrap}
.upd.hide{opacity:0}.upd.ok{color:var(--green)}
.sync{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ================= v6 ================= */
.tabs{grid-template-columns:repeat(4,1fr)}
body.no-month .month{display:none}

/* lignes de choix sur une seule ligne, défilables */
.chips.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  margin:0 -16px;padding:0 16px 2px;scroll-padding-inline:16px}
.chips.row::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .em{font-size:16px;line-height:1}
.chip.more{color:var(--blue);background:transparent;border:1px solid var(--sep);font-weight:600}
.sugg{font-size:12px;color:var(--blue);font-weight:600;margin:8px 2px 0;min-height:15px}

/* icônes de catégorie */
.cico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:18px;line-height:1;
  background:color-mix(in srgb,var(--c,#8e8e93) 18%,transparent)}
.ico.INC{background:var(--green-ui)}.ico.TRF{background:var(--indigo)}

/* ---------- Historique ---------- */
.searchbar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.sfield{flex:1;position:relative}
.sfield svg{position:absolute;left:12px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--label2);pointer-events:none}
.sfield input{width:100%;min-height:44px;border:0;border-radius:12px;background:var(--fill);padding:10px 40px 10px 38px;font-size:17px;-webkit-appearance:none;appearance:none}
.sfield .clr{position:absolute;right:4px;top:50%;margin-top:-18px;width:36px;height:36px;border:0;background:transparent;color:var(--label2);font-size:18px;display:none}
.sfield.has .clr{display:block}
.fbtn{position:relative;width:44px;height:44px;flex:none;border:0;border-radius:12px;background:var(--fill);color:var(--blue);display:grid;place-items:center}
.fbtn svg{width:22px;height:22px}
.fbtn .n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px}
.fbtn.on .n{display:grid}
.factive{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.ftag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 6px 0 12px;border-radius:999px;border:0;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font-size:14px;font-weight:600}
.ftag b{font-weight:700;font-size:16px;width:22px;height:22px;display:grid;place-items:center}
.hsum{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--label2);margin:6px 4px 0}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:20px 4px 6px;font-size:13px;font-weight:600;color:var(--label2)}
.dayh .d{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayh .t{font-variant-numeric:tabular-nums;color:var(--label)}
.dayh .t.inc{color:var(--green)}
.sw{position:relative;overflow:hidden}
.sw+.sw{border-top:.5px solid var(--sep)}
.sw .bin{position:absolute;inset:0;background:var(--red-ui);display:flex;align-items:center;padding-left:0;border:0;color:#fff;width:100%;cursor:pointer}
.sw .bin span{width:76px;display:grid;place-items:center;transition:transform .2s}
.sw .bin svg{width:24px;height:24px}
.sw .item{position:relative;background:var(--card);touch-action:pan-y;transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}
.sw.drag .item{transition:none}
.sw.gone{transition:height .25s ease,opacity .25s;opacity:0}
.list .sw:first-child .item{border-top-left-radius:inherit;border-top-right-radius:inherit}
.item+.item{border-top:0}
.item .amt.EXP{color:var(--label)}
.swipe-hint{font-size:12px;color:var(--label3);text-align:center;margin:14px 0 0}

/* ---------- Feuilles (édition, filtres, choix) ---------- */
.sheet{background:var(--bg)}
.sh-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 -4px 6px}
.sh-nav b{font-size:17px}
.sh-nav button{min-height:44px;min-width:64px;border:0;background:transparent;color:var(--blue);font-size:17px;padding:0 4px}
.sh-nav button.strong{font-weight:700}
.sh-nav button[disabled]{color:var(--label3)}
.e-amt{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 16px}
.e-amt input{max-width:72%;text-align:right;border:0;outline:0;background:transparent;font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;padding:0}
.e-amt span{font-size:28px;font-weight:600;color:var(--label2)}
.grp{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 16px;width:100%;border:0;background:transparent;text-align:left;font-size:17px}
.frow+.frow,.frow+.fblock,.fblock+.frow{border-top:.5px solid var(--sep)}
.frow .k{color:var(--label);flex:none}

<script>
(function(){
'use strict';
var VERSION='6';

/* =====================================================================
   Connexion
   ===================================================================== */
var CONF = loadConf();
function loadConf(){ try{ var c=JSON.parse(localStorage.getItem('budget:conf')||'null'); if(c && c.url && c.k) return c; }catch(e){} return null; }
function saveConf(c){ try{ if(c) localStorage.setItem('budget:conf',JSON.stringify(c)); else localStorage.removeItem('budget:conf'); }catch(e){} }
var TYPES = { EXP:{label:'Ajouter la dépense'}, INC:{label:'Ajouter le revenu'}, TRF:{label:'Enregistrer le virement'} };
var OPEN_W = 76;          // largeur de la poubelle révélée par le glissement

var S = {
  view:'home', ym:currentYm(), sync:null, syncedAt:0, data:null, seq:0, loading:false, loadError:null,
  f:{ type:'EXP', cat:'', catAuto:false, catRule:'', acct:'', src:'', from:'', to:'' },
  busy:false, reqId:null, showAllCats:false,
  h:{ q:'', period:'month', type:'all', account:'', category:'' },
  pend:{}, openRow:null, setPage:'main', budgetDraft:null, edit:null
};

/* =====================================================================
   Utilitaires
   ===================================================================== */
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
var fmt; try { fmt = new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}); } catch(e){ fmt=null; }
function eur(n){ n=Number(n)||0; return fmt ? fmt.format(n) : n.toFixed(2).replace('.',',')+' €'; }
function eurR(n){ n=Number(n)||0; return Math.abs(n-Math.round(n))<0.005 ? eur(n).replace(/[,.]00(?=\s?€)/,'') : eur(n); }
function amtInput(n){ return (Math.round(n*100)/100).toFixed(2).replace('.',',').replace(/,00$/,''); }
function pct(n){ return Math.round(n*100)+' %'; }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem('budget:'+k); localStorage.setItem('budget:'+k,v); }catch(e){} return null; }
function currentYm(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function todayIso(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function shiftYm(ym,d){ var y=+ym.slice(0,4), m=+ym.slice(5,7)-1+d; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+('0'+(m+1)).slice(-2); }
function daysIn(ym){ return new Date(Date.UTC(+ym.slice(0,4),+ym.slice(5,7),0)).getUTCDate(); }
function serialToDate(s){ return new Date((s-25569)*86400000); }
function serialToIso(s){ var d=serialToDate(s); return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2); }
function ymOfSerial(sr){ return serialToIso(sr).slice(0,7); }
function dayLabel(s){ try{ return serialToDate(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}); }catch(e){ return ''; } }
function normTxt(x){ return String(x==null?'':x).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function r2(n){ return Math.round(n*100)/100; }
function cap(s){ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
function uuid(){
  try{ if(window.crypto && crypto.getRandomValues){ var a=new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2);}).join(''); } }catch(e){}
  return (Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).slice(0,32);
}
function parseAmt(s){
  s=String(s||'').replace(/[\s  €]/g,'');
  if(s.indexOf(',')>=0 && s.indexOf('.')>=0) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else s=s.replace(',','.');
  if(!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return parseFloat(s);
}
var SVG_TRASH='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9.5 7V4.8c0-.4.4-.8.8-.8h3.4c.4 0 .8.4.8.8V7M6.5 7l.9 12.2c.1.9.8 1.8 1.8 1.8h5.6c1 0 1.7-.9 1.8-1.8L17.5 7M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var SVG_BACK='<svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* Icône + couleur d'une catégorie, devinées d'après son nom (marche aussi pour de nouvelles catégories). */
var CAT_ICONS=[
  [/course|supermarch|epicerie|alimentation/,'🛒','#34c759'],[/nourriture|restau|resto|repas|food|fast/,'🍔','#ff9500'],
  [/loyer|logement|appart/,'🏠','#af52de'],[/abonn/,'🔁','#5856d6'],[/sortie|loisir|cinema|bar|fete/,'🎉','#ff2d55'],
  [/distrib|retrait|cash|especes/,'🏧','#30b0c7'],[/cadeau/,'🎁','#ff2d55'],[/^dons?$|charit|association/,'🤝','#ffcc00'],
  [/gros achat|achat/,'📦','#a2845e'],[/invest|bourse|epargne|crypto/,'📈','#34c759'],[/vetement|habit|mode/,'👕','#5ac8fa'],
  [/laverie|pressing|lessive/,'🧺','#64d2ff'],[/transport|essence|carbur|train|navigo|bus|velo/,'🚆','#007aff'],
  [/sante|pharma|medecin|docteur/,'💊','#ff3b30'],[/sport|gym|salle/,'🏋️','#ff9500'],[/telephone|internet|mobile|forfait/,'📱','#5856d6'],
  [/voyage|vacance|avion|hotel/,'✈️','#007aff'],[/etude|ecole|fac|livre/,'📚','#af52de'],[/beaute|coiff/,'💇','#ff2d55'],
  [/autre|divers/,'•••','#8e8e93']];
function catMeta(name){ var n=normTxt(name); for(var i=0;i<CAT_ICONS.length;i++) if(CAT_ICONS[i][0].test(n)) return { e:CAT_ICONS[i][1], c:CAT_ICONS[i][2] }; return { e:'🏷️', c:'#8e8e93' }; }
function catIcon(name){ var m=catMeta(name), d=el('div','cico',m.e); d.style.setProperty('--c',m.c); d.setAttribute('aria-hidden','true'); return d; }

/* Même logique que merchantKey_/findRule_ côté serveur. */
function merchantKey(s){ return normTxt(s).replace(/[0-9]+/g,' ').replace(/[^a-z ]+/g,' ').split(' ').filter(function(w){ return w.length>=2; }).slice(0,3).join(' '); }
function findRule(desc, rules){
  var k=merchantKey(desc); if(!k) return null; var best=null;
  (rules||[]).forEach(function(r){ if((k===r.key || k.indexOf(r.key+' ')===0) && (!best || r.key.length>best.key.length)) best=r; });
  return best;
}

/* =====================================================================
   Appels serveur
   ===================================================================== */
var ACTIONS = {
  getSync:           function(){ return { action:'sync' }; },
  addTransaction:    function(p,id){ return { action:'add', payload:p, requestId:id, want:'sync' }; },
  updateTransaction: function(r,c){ return { action:'update', ref:r, changes:c, want:'sync' }; },
  deleteTransaction: function(r){ return { action:'delete', ref:r, want:'sync' }; },
  setBudgets:        function(b){ return { action:'setBudgets', budgets:b }; },
  deleteRule:        function(k){ return { action:'deleteRule', key:k }; }
};
function call(name){
  var body=ACTIONS[name].apply(null,[].slice.call(arguments,1));
  var retries = (name==='deleteTransaction' || name==='deleteRule') ? 0 : 2;   // une suppression n'est jamais rejouée
  return api(CONF, body, retries).catch(function(e){ if(e.auth) needSetup(e.message); throw e; });
}
function api(conf, body, retries){
  body.k=conf.k;
  var payload=JSON.stringify(body);
  function once(){
    return new Promise(function(resolve,reject){
      var ctrl=null; try{ ctrl=new AbortController(); }catch(e){}
      var timer=setTimeout(function(){ if(ctrl) ctrl.abort(); }, 30000);
      fetch(conf.url,{ method:'POST', body:payload, headers:{'Content-Type':'text/plain;charset=utf-8'},
                       redirect:'follow', cache:'no-store', credentials:'omit', signal: ctrl?ctrl.signal:undefined })
        .then(function(r){ return r.text().then(function(t){ return { status:r.status, text:t }; }); })
        .then(function(res){
          clearTimeout(timer); setOffline(false);
          var j=null; try{ j=JSON.parse(res.text); }catch(e){}
          if(!j){
            var er=new Error(res.status>=500 ? 'Google ne répond pas pour le moment ('+res.status+'). Réessaie.'
              : 'Réponse inattendue de Google. Vérifie le lien et que le déploiement est accessible à « Tout le monde ».');
            er.retry=res.status>=500; return reject(er);
          }
          if(j.success) return resolve(j.data);
          var e2=new Error(j.error||'Erreur inconnue.'); e2.auth=/jeton|Accès refusé/i.test(j.error||''); reject(e2);
        }, function(err){
          clearTimeout(timer);
          var off = navigator.onLine===false; if(off) setOffline(true);
          var e=new Error(err && err.name==='AbortError' ? 'Google met trop de temps à répondre. Réessaie.'
                         : (off ? 'Pas de connexion internet.' : 'Connexion impossible. Réessaie.'));
          e.retry=!off; reject(e);
        });
    });
  }
  var n=0;
  function run(){ return once().catch(function(e){ if(e.retry && n<retries){ n++; return new Promise(function(r){ setTimeout(r,700*n); }).then(run); } throw e; }); }
  return run();
}
function setOffline(on){ document.body.classList.toggle('is-offline',!!on); }
var updT=null;
function setUpd(state){
  var u=$('upd'); clearTimeout(updT); u.classList.remove('ok');
  if(state==='busy'){ u.textContent='Actualisation…'; u.classList.remove('hide'); }
  else if(state==='ok'){ u.textContent='À jour ✓'; u.classList.add('ok'); u.classList.remove('hide'); updT=setTimeout(function(){ u.classList.add('hide'); },1800); }
  else u.classList.add('hide');
}

/* ---------- toast (avec action « Annuler ») ---------- */
var toastT=null;
function toast(msg,isErr,action,ms){
  var t=$('toast'), b=$('toastAct'); $('toastTxt').textContent=msg; $('toastIco').textContent=isErr?'!':'✓';
  t.classList.toggle('err',!!isErr); t.classList.add('on');

  if(action){ b.textContent=action.label; b.onclick=function(){ t.classList.remove('on'); clearTimeout(toastT); action.fn(); }; }
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); }, ms || (isErr?4000:2200));
}

/* ---------- connexion ---------- */
function parseLink(raw){
  var t=String(raw||'').trim().replace(/\s+/g,'');
  var u; try{ u=new URL(t); }catch(e){ return null; }
  if(u.protocol!=='https:' || !/(^|\.)google\.com$/.test(u.hostname) || !/\/exec$/.test(u.pathname)) return null;
  var k=u.searchParams.get('k')||'';
  if(!/^[A-Za-z0-9]{20,64}$/.test(k)) return null;
  return { url:u.origin+u.pathname, k:k };
}

/* =====================================================================
   Données : une synchro complète, tout le reste est calculé sur le téléphone
   tx = [onglet, ligne, date, montant, libellé, catégorie, compte, de, vers, prévu, note]
   ===================================================================== */
var MONTHS_FR=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function txObj(x){
  return { x:x, key:x[0]+':'+x[1], sheet:x[0], row:x[1], serial:x[2]||null, amount:x[3], label:x[4]||'', category:x[5]||'', account:x[6]||'',
           from:x[7]||'', to:x[8]||'', planned:!!x[9], note:x[10]||'', ym: x[2] ? ymOfSerial(x[2]) : null };
}
function refOf(x){ return { sheet:x[0], row:x[1], serial:x[2], amount:x[3] }; }
function monthLabel(ym){ var m=+ym.slice(5,7); return cap(MONTHS_FR[m-1])+' '+ym.slice(0,4); }

/* Les opérations « prévues » (ancienne fonction) ne sont plus comptées nulle part. */
function computeDashboard(sy, ym){
  var today=todayIso();
  var sav=(sy.savings||[]).map(normTxt), isSav=function(a){ return sav.indexOf(normTxt(a))>=0; };
  var acc={}, accOrder=[];
  sy.accounts.forEach(function(a){ acc[a.name]={ name:a.name, real:a.initial, savings:isSav(a.name) }; accOrder.push(a.name); });
  var m={ income:0, expenses:0, saved:0 }, cat={}, catOrder=[], uncategorized=0;
  sy.categories.forEach(function(c){ cat[c.name]={ name:c.name, budget:c.budget, spent:0 }; catOrder.push(c.name); });
  sy.tx.forEach(function(x){
    var t=txObj(x); if(t.planned) return;
    if(t.sheet==='EXP' && acc[t.account]) acc[t.account].real-=t.amount;
    if(t.sheet==='INC' && acc[t.account]) acc[t.account].real+=t.amount;
    if(t.sheet==='TRF'){ if(acc[t.from]) acc[t.from].real-=t.amount; if(acc[t.to]) acc[t.to].real+=t.amount; }
    if(t.ym!==ym) return;
    if(t.sheet==='EXP'){ m.expenses+=t.amount; if(cat[t.category]) cat[t.category].spent+=t.amount; else uncategorized+=t.amount; }
    else if(t.sheet==='INC') m.income+=t.amount;
    else { if(isSav(t.to) && !isSav(t.from)) m.saved+=t.amount; if(isSav(t.from) && !isSav(t.to)) m.saved-=t.amount; }
  });
  var accounts=accOrder.map(function(k){ var a=acc[k]; return { name:a.name, real:r2(a.real), savings:a.savings }; });
  var categories=catOrder.map(function(k){ var c=cat[k]; return { name:c.name, budget:r2(c.budget), spent:r2(c.spent) }; });
  if(uncategorized>0) categories.push({ name:'Sans catégorie', budget:0, spent:r2(uncategorized), warning:true });
  var dim=daysIn(ym), curYm=today.slice(0,7);
  return {
    ym:ym, label:monthLabel(ym), today:today, daysInMonth:dim,
    daysElapsed: ym<curYm ? dim : (ym>curYm ? 0 : +today.slice(8,10)),
    lists:{ categories:sy.categories.map(function(c){ return c.name; }), accounts:sy.accounts.map(function(a){ return a.name; }), sources:sy.sources },
    totals:{ balance:r2(accounts.reduce(function(a,b){ return a+b.real; },0)), income:r2(m.income), expenses:r2(m.expenses), saved:r2(m.saved),
             savingsRate: m.income>0 ? Math.round((m.income-m.expenses)/m.income*1000)/1000 : null,
             budget:r2(sy.categories.reduce(function(a,c){ return a+c.budget; },0)) },
    accounts:accounts, categories:categories
  };
}

/* Historique filtré + recherche (sur le mois affiché ou sur tout). */
function amtStrings(a){ var f=a.toFixed(2); return [f, f.replace('.',','), String(r2(a)), String(r2(a)).replace('.',',')].join(' '); }
function histItems(sy, h, ym, pend){
  var toks=normTxt(h.q).split(' ').filter(Boolean);
  return sy.tx.map(txObj).filter(function(t){
    if(pend && pend[t.key]) return false;
    if(h.period==='month' && t.ym!==ym) return false;
    if(h.type!=='all' && t.sheet!==h.type) return false;
    if(h.account && t.account!==h.account && t.from!==h.account && t.to!==h.account) return false;
    if(h.category && !(t.sheet==='EXP' && t.category===h.category)) return false;
    if(toks.length){
      var hay=normTxt([t.label,t.category,t.account,t.from,t.to,t.note,t.sheet==='TRF'?'virement':'',amtStrings(t.amount)].join(' '));
      for(var i=0;i<toks.length;i++) if(hay.indexOf(toks[i])<0) return false;
    }
    return true;
  }).sort(function(a,b){ return (b.serial||0)-(a.serial||0) || (a.sheet<b.sheet?-1:a.sheet>b.sheet?1:0) || b.row-a.row; });
}
function dayTotal(items){
  var exp=0, inc=0;
  items.forEach(function(t){ if(t.planned) return; if(t.sheet==='EXP') exp+=t.amount; else if(t.sheet==='INC') inc+=t.amount; });
  if(exp>0) return { txt:'−'+eur(exp), cls:'' };
  if(inc>0) return { txt:'+'+eur(inc), cls:'inc' };
  return { txt:'', cls:'' };
}
/* Catégories les plus utilisées (pour la ligne rapide de l'écran Ajouter). */
function topCategories(sy, n){
  var cnt={}, names=sy.categories.map(function(c){ return c.name; });
  sy.tx.forEach(function(x){ if(x[0]==='EXP' && x[5]) cnt[x[5]]=(cnt[x[5]]||0)+1; });
  return names.slice().sort(function(a,b){ return (cnt[b]||0)-(cnt[a]||0) || names.indexOf(a)-names.indexOf(b); }).slice(0,n);
}
/* Suggestions de budget : moyenne des mois complets récents, sinon dépensé ce mois-ci. */
function budgetSuggestions(sy){
  var today=todayIso(), cur=today.slice(0,7), months=[shiftYm(cur,-1),shiftYm(cur,-2),shiftYm(cur,-3)];
  var spent={}, has={}, curSpent={};
  months.forEach(function(m){ spent[m]={}; });
  sy.tx.forEach(function(x){
    var t=txObj(x); if(t.planned || t.sheet!=='EXP' || !t.ym) return;
    if(spent[t.ym]){ has[t.ym]=true; spent[t.ym][t.category]=(spent[t.ym][t.category]||0)+t.amount; }
    if(t.ym===cur) curSpent[t.category]=(curSpent[t.category]||0)+t.amount;
  });
  var used=months.filter(function(m){ return has[m]; });
  var out={ basis: used.length ? 'avg' : 'cur', months:used.length, items:{} };
  sy.categories.forEach(function(c){
    var v = used.length ? used.reduce(function(a,m){ return a+(spent[m][c.name]||0); },0)/used.length : (curSpent[c.name]||0);
    out.items[c.name]={ ref:r2(v), suggested: v>0 ? Math.ceil(v/5)*5 : 0 };
  });
  return out;
}

/* ---------- synchro ---------- */
function recompute(){ if(S.sync){ S.data=computeDashboard(S.sync,S.ym); S.loadError=null; } renderAll(); }
function applySync(sy){
  if(!sy || !sy.tx) return;
  S.sync=sy; S.syncedAt=Date.now(); store('syncedAt',String(S.syncedAt));
  try{ localStorage.setItem('budget:sync',JSON.stringify(sy)); }catch(e){}
  recompute();
}
function load(force){
  if(!CONF){ needSetup(); return; }
  if(!S.sync){ try{ var c=JSON.parse(localStorage.getItem('budget:sync')||'null'); if(c && c.tx) S.sync=c; }catch(e){} }
  if(!S.syncedAt){ S.syncedAt=+(store('syncedAt')||0); }
  recompute();
  if(!force && S.sync && Date.now()-S.syncedAt < 30000) return;
  if(S.loading) return;
  var my=++S.seq; S.loading=true; setUpd('busy');
  call('getSync').then(function(sy){ if(my===S.seq){ applySync(sy); setUpd('ok'); } })
    .catch(function(e){ if(my!==S.seq) return; setUpd(''); S.loadError=e.message; if(S.data) toast(e.message,true); renderAll(); })
    .then(function(){ if(my===S.seq) S.loading=false; });
}
function changeMonth(d){
  S.ym=shiftYm(S.ym,d); recompute();
  if(!S.loading && (!S.syncedAt || Date.now()-S.syncedAt>120000)) load();
}

/* ---------- suppression différée avec « Annuler » ---------- */
function deleteTx(x){
  var k=x[0]+':'+x[1]; if(S.pend[k]) return;
  var idx=S.sync.tx.indexOf(x);
  S.sync.tx=S.sync.tx.filter(function(t){ return t[0]+':'+t[1]!==k; });
  S.pend[k]={ x:x, idx:idx, timer:setTimeout(function(){ commitDelete(k); },4500) };
  store('swipeHint','1');
  recompute();
  toast('Opération supprimée', false, { label:'Annuler', fn:function(){ undoDelete(k); } }, 4500);
}
function undoDelete(k){
  var p=S.pend[k]; if(!p || p.sent) return;
  clearTimeout(p.timer); delete S.pend[k];
  if(!S.sync.tx.some(function(t){ return t[0]+':'+t[1]===k; })) S.sync.tx.splice(Math.max(0,Math.min(p.idx,S.sync.tx.length)),0,p.x);
  recompute(); toast('Suppression annulée');
}
function commitDelete(k){
  var p=S.pend[k]; if(!p || p.sent) return; p.sent=true;
  call('deleteTransaction', refOf(p.x)).then(function(res){ delete S.pend[k]; if(res && res.sync) applySync(res.sync); })
    .catch(function(e){ delete S.pend[k]; toast(e.message,true); load(true); });
}
function flushDeletes(){                     // l'app passe en arrière-plan : on envoie tout de suite
  Object.keys(S.pend).forEach(function(k){
    var p=S.pend[k]; if(p.sent) return; clearTimeout(p.timer); p.sent=true;
    var body=JSON.stringify({ k:CONF.k, action:'delete', ref:refOf(p.x) }), ok=false;
    try{ ok=!!(navigator.sendBeacon && navigator.sendBeacon(CONF.url, new Blob([body],{type:'text/plain;charset=UTF-8'}))); }catch(e){}
    if(!ok){ try{ fetch(CONF.url,{ method:'POST', body:body, headers:{'Content-Type':'text/plain;charset=utf-8'}, keepalive:true, credentials:'omit', mode:'no-cors' }); }catch(e){} }
    delete S.pend[k];
  });
  S.syncedAt=0; store('syncedAt','0');
}

function bar(spent,budget){

function validateForm(){

/* ---------- glisser pour supprimer (vers la droite, comme dans les apps iOS) ---------- */
function closeOpenRow(except){
  var w=S.openRow; if(!w || w===except) return;
  w.classList.remove('open'); var it=w.querySelector('.item'); if(it) it.style.transform=''; S.openRow=null;
}
function collapse(wrap,done){
  closeOpenRow();
  var it=wrap.querySelector('.item'); if(it) it.style.transform='translateX('+wrap.offsetWidth+'px)';
  wrap.style.height=wrap.offsetHeight+'px'; void wrap.offsetHeight;
  wrap.classList.add('gone'); wrap.style.height='0px';
  setTimeout(done,230);
}
function makeSwipe(wrap,item,onDelete,onTap){
  var id=null, x0=0, y0=0, dx=0, mode=null, start=0, W=0, moved=false;
  item.addEventListener('pointerdown',function(e){
    if(e.button>0) return; closeOpenRow(wrap);
    id=e.pointerId; x0=e.clientX; y0=e.clientY; dx=0; mode=null; moved=false;
    W=wrap.offsetWidth; start=wrap.classList.contains('open') ? OPEN_W : 0;
  });
  item.addEventListener('pointermove',function(e){
    if(e.pointerId!==id) return;
    var mx=e.clientX-x0, my=e.clientY-y0;
    if(!mode){
      if(Math.abs(mx)>8 && Math.abs(mx)>Math.abs(my)*1.2){ mode='h'; moved=true; wrap.classList.add('drag'); try{ item.setPointerCapture(id); }catch(_){} }
      else if(Math.abs(my)>8){ mode='v'; moved=true; }
    }
    if(mode==='h'){ dx=Math.max(0,Math.min(W,start+mx)); item.style.transform='translateX('+dx+'px)'; e.preventDefault(); }
  });
  function end(e){
    if(e.pointerId!==id) return; id=null; wrap.classList.remove('drag');
    if(mode==='h'){
      if(dx>W*0.5){ onDelete(); }
      else if(dx>44){ wrap.classList.add('open'); item.style.transform='translateX('+OPEN_W+'px)'; S.openRow=wrap; }
      else { wrap.classList.remove('open'); item.style.transform=''; if(S.openRow===wrap) S.openRow=null; }
    }
    mode=null;
  }
  item.addEventListener('pointerup',end);
  item.addEventListener('pointercancel',function(e){ if(e.pointerId!==id) return; id=null; wrap.classList.remove('drag'); if(mode==='h' && !wrap.classList.contains('open')) item.style.transform=''; mode=null; });
  item.addEventListener('click',function(e){
    if(moved){ moved=false; e.preventDefault(); return; }
    if(wrap.classList.contains('open')){ wrap.classList.remove('open'); item.style.transform=''; S.openRow=null; return; }
    onTap();
  });
}

    : 'Pas encore de mois complet : la suggestion correspond à ce que tu as dépensé ce mois-ci. Elle deviendra une vraie moyenne dès le mois prochain.')).style.margin='0 4px 14px';
  var tools=el('div','bud-tools'), ap=el('button',null,'Appliquer les suggestions'); ap.type='button';
  ap.onclick=function(){ sy.categories.forEach(function(c){ D[c.name]=amtInput(sug.items[c.name].suggested); }); renderSet(); };
  tools.appendChild(ap); host.appendChild(tools);
  var g=el('div','grp'), changed=0, total=0;
  sy.categories.forEach(function(c){
    var row=el('div','bud-row'); row.appendChild(catIcon(c.name));
    var nm=el('div','nm'); nm.appendChild(el('b',null,c.name));
    var it=sug.items[c.name], sm=el('small');
    sm.appendChild(document.createTextNode((sug.basis==='avg'?'Moyenne : ':'Ce mois-ci : ')+eur(it.ref)+(it.suggested && it.suggested!==c.budget ? ' · ' : '')));
    if(it.suggested && it.suggested!==c.budget){ var a=el('a',null,'utiliser '+eurR(it.suggested)); a.href='#'; a.onclick=function(e){ e.preventDefault(); D[c.name]=amtInput(it.suggested); renderSet(); }; sm.appendChild(a); }
    nm.appendChild(sm); row.appendChild(nm);
    var v=parseAmt(D[c.name]); var isCh = !(Math.abs((isNaN(v)?-1:v)-c.budget)<0.005);
    if(isCh) changed++; total += isNaN(v)?0:v;
    var box=el('label','bud-in'+(isCh?' changed':'')), inp=el('input'); inp.inputMode='decimal'; inp.value=D[c.name]; inp.setAttribute('aria-label','Budget '+c.name);
    inp.oninput=function(){ D[c.name]=inp.value; var vv=parseAmt(inp.value); box.classList.toggle('changed', !(Math.abs((isNaN(vv)?-1:vv)-c.budget)<0.005)); updateSave(); };
    box.appendChild(inp); box.appendChild(el('span',null,'€')); row.appendChild(box); g.appendChild(row);
  });
  host.appendChild(g);
  var tl=el('div','set-foot num'); tl.id='budTotal'; host.appendChild(tl);
  var save=el('button','submit TRF sticky-save'); save.type='button'; save.id='budSave';
  save.appendChild(el('span','txt','Enregistrer')); save.appendChild(el('span','spin')); host.appendChild(save);
  function updateSave(){
    var n=0, bad=false, tot=0;
    sy.categories.forEach(function(c){ var vv=parseAmt(D[c.name]); if(D[c.name]==='' ) vv=0; if(isNaN(vv)) bad=true; else { tot+=vv; if(!(Math.abs(vv-c.budget)<0.005)) n++; } });
    $('budTotal').textContent='Total : '+eurR(tot)+' / mois'+(n? ' · '+n+' modification'+(n>1?'s':''):'');
    save.disabled = bad || !n || S.busy;
    save.querySelector('.txt').textContent = bad ? 'Montant invalide' : (n ? 'Enregistrer ('+n+')' : 'Enregistrer');
  }
  save.onclick=function(){
    if(save.disabled) return;
    var list=[]; sy.categories.forEach(function(c){ var vv=D[c.name]==='' ? 0 : parseAmt(D[c.name]); if(!(Math.abs(vv-c.budget)<0.005)) list.push([c.name, vv]); });
    S.busy=true; save.classList.add('busy'); save.disabled=true;
    call('setBudgets', list).then(function(res){ S.budgetDraft=null; applySync(res.sync); toast('Budgets enregistrés'); })
      .catch(function(e){ toast(e.message,true); })
      .then(function(){ S.busy=false; if(S.setPage==='budgets') renderSet(); });
  };
  updateSave();
}
function renderRules(host){
  var rules=(S.sync.rules||[]).slice().sort(function(a,b){ return a.key<b.key?-1:1; });
  host.appendChild(backLink());
  host.appendChild(el('h2',null,'Catégories apprises')).style.cssText='margin:0 4px 6px;font-size:24px';
  host.appendChild(el('div','set-foot','Chaque paiement Apple Pay chez ces marchands reçoit automatiquement la catégorie indiquée. Glisse vers la droite pour oublier un marchand.')).style.margin='0 4px 14px';
  if(!rules.length){ host.appendChild(el('div','card empty','Aucun marchand mémorisé pour l’instant. Corrige une catégorie dans l’Historique et elle apparaîtra ici.')); return; }
  var g=el('div','card list');
  rules.forEach(function(r){
    var wrap=el('div','sw rule-row'), bin=el('button','bin'); bin.type='button'; bin.setAttribute('aria-label','Oublier '+r.key);
    var bs=el('span'); bs.innerHTML=SVG_TRASH; bin.appendChild(bs);
    var item=el('div','item'); item.appendChild(catIcon(r.category));
    var m=el('div','m'); m.appendChild(el('b',null,r.key)); m.appendChild(el('small',null,r.example ? 'ex. '+r.example : '')); item.appendChild(m);
    item.appendChild(el('span','pill',r.category));
    wrap.appendChild(bin); wrap.appendChild(item);
    var forget=function(){ collapse(wrap,function(){
      call('deleteRule', r.key).then(function(res){ applySync(res.sync); toast('« '+cap(r.key)+' » oublié'); })
        .catch(function(e){ toast(e.message,true); renderSet(); });
    }); };
    makeSwipe(wrap,item,forget,function(){}); bin.onclick=forget;
    g.appendChild(wrap);
  });
  host.appendChild(g);
}

/* ---------- navigation ---------- */
var TITLES={ home:'Budget', add:'Ajouter', hist:'Historique', set:'Réglages' };
function updateMonthVisibility(){ document.body.classList.toggle('no-month', S.view==='add' || S.view==='set' || (S.view==='hist' && S.h.period==='all')); }
function show(v){
  if(S.view==='set' && v==='set'){ S.setPage='main'; }
  S.view=v; closeOpenRow();
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.setAttribute('aria-selected', b.dataset.v===v?'true':'false'); });
  ['home','add','hist','set'].forEach(function(x){ $('v-'+x).classList.toggle('on',x===v); });
  $('title').textContent=TITLES[v]; updateMonthVisibility();
  if(v==='set') renderSet();
  window.scrollTo(0,0); store('view',v);
}

/* ---------- événements ---------- */
document.querySelector('.tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) show(b.dataset.v); });
$('typeSeg').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; S.f.type=b.dataset.t; S.reqId=null; store('type',S.f.type); renderForm(); });
$('submit').addEventListener('click',submit);
$('form').addEventListener('submit',function(e){ e.preventDefault(); submit(); });
$('form').addEventListener('input',function(){ S.reqId=null; });
$('desc').addEventListener('input',suggestCategory);
$('amt').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); if(S.f.type==='EXP') $('desc').focus(); else $('amt').blur(); } });
$('prev').addEventListener('click',function(){ changeMonth(-1); });
$('next').addEventListener('click',function(){ changeMonth(1); });
$('q').addEventListener('input',function(){ S.h.q=$('q').value; renderHist(); });
$('qclr').addEventListener('click',function(){ $('q').value=''; S.h.q=''; renderHist(); $('q').focus(); });
$('fbtn').addEventListener('click',openFilters);
$('backdrop').addEventListener('click',function(){ if(!(S.edit && S.edit.busy)) closeSheet(); });
$('pback').addEventListener('click',closePicker);
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if($('picker').classList.contains('on')) closePicker(); else if(!(S.edit && S.edit.busy)) closeSheet(); } });
document.addEventListener('pointerdown',function(e){ if(S.openRow && !S.openRow.contains(e.target)) closeOpenRow(); },true);
window.addEventListener('scroll',function(){ closeOpenRow(); },{ passive:true });
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'){ if(CONF) flushDeletes(); }
  else if(!S.busy && CONF) load();
});
window.addEventListener('pagehide',function(){ if(CONF) flushDeletes(); });
window.addEventListener('pageshow',function(e){ if(e.persisted && !S.busy && CONF) load(); });
window.addEventListener('online',function(){ setOffline(false); if(!S.busy && CONF) load(true); });
window.addEventListener('offline',function(){ setOffline(true); });
$('setupBtn').addEventListener('click',trySetup);
$('setupLink').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); trySetup(); } });
document.addEventListener('dblclick',function(e){ e.preventDefault(); },{passive:false});

/* ---------- démarrage ---------- */
$('date').value=todayIso();
var t0=store('type'); if(t0 && TYPES[t0]) S.f.type=t0;
S.f.acct=store('acct')||'';
if(CONF){ var v0=store('view'); show(v0==='add'||v0==='hist'||v0==='set' ? v0 : 'home'); load(); }
else needSetup('');
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

/* exposé pour les tests automatiques uniquement */
window.__budget={ computeDashboard:computeDashboard, histItems:histItems, dayTotal:dayTotal, budgetSuggestions:budgetSuggestions, topCategories:topCategories,
  merchantKey:merchantKey, findRule:findRule, catMeta:catMeta, parseAmt:parseAmt, S:S };
})();
</script>
</body>
